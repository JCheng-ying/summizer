<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>科技产业关系图谱</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);

    --slot-1: #2a78d6; /* blue */
    --slot-2: #eb6834; /* orange */
    --slot-3: #1baf7a; /* aqua */
    --slot-4: #eda100; /* yellow */
    --slot-5: #e87ba4; /* magenta */
    --slot-6: #008300; /* green */
    --slot-7: #4a3aa7; /* violet */
    --slot-8: #e34948; /* red */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);

      --slot-1: #3987e5;
      --slot-2: #d95926;
      --slot-3: #199e70;
      --slot-4: #c98500;
      --slot-5: #d55181;
      --slot-6: #008300;
      --slot-7: #9085e9;
      --slot-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);

    --slot-1: #3987e5;
    --slot-2: #d95926;
    --slot-3: #199e70;
    --slot-4: #c98500;
    --slot-5: #d55181;
    --slot-6: #008300;
    --slot-7: #9085e9;
    --slot-8: #e66767;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 300px; flex: 0 0 300px;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
  }
  #sidebar h1 { font-size: 15px; margin: 0 0 4px; }
  #sidebar .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

  #search-wrap { position: relative; margin-bottom: 14px; }
  input[type="search"] {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page);
    color: var(--text-primary); font-size: 13px;
  }
  #search-suggestions {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    max-height: 220px; overflow-y: auto; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .suggestion-item {
    padding: 7px 10px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; color: var(--text-primary);
  }
  .suggestion-item:hover { background: var(--page); }
  .suggestion-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .suggestion-item .type-label { color: var(--text-muted); font-size: 11px; margin-left: auto; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); margin: 14px 0 6px;
  }

  #sector-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .sector-tab {
    font-size: 12px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; user-select: none;
    color: var(--text-secondary); background: transparent;
  }
  .sector-tab.active { color: var(--surface-1); background: var(--slot-1); border-color: var(--slot-1); }

  #sector-signals {
    margin-bottom: 4px; max-height: 340px; overflow-y: auto; padding-right: 4px;
  }
  .signal-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    font-size: 12px; line-height: 1.5; cursor: pointer; transition: border-color .15s;
  }
  .signal-item:hover { border-color: var(--slot-1); }
  .signal-item .signal-date {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 5px; font-variant-numeric: tabular-nums;
  }
  .signal-item .signal-title { font-weight: 600; color: var(--text-primary); margin-bottom: 5px; text-wrap: balance; }
  .signal-item .signal-desc { color: var(--text-secondary); margin-bottom: 6px; }
  .signal-item .signal-cta { color: var(--slot-1); font-size: 11px; font-weight: 500; }

  .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--border); margin-left: 6px; color: var(--text-secondary);
  }
  .badge.hot { color: var(--slot-8); border-color: var(--slot-8); }
  .badge.cold { color: var(--text-muted); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .chip {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--border); cursor: pointer; user-select: none;
    color: var(--text-secondary); background: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .chip.active { color: var(--text-primary); border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

  #detail {
    border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px;
    font-size: 13px; line-height: 1.5;
  }
  #detail .placeholder { color: var(--text-muted); }
  #detail h2 { font-size: 14px; margin: 0 0 6px; }
  #detail .meta { color: var(--text-muted); font-size: 12px; margin-bottom: 10px; }
  #detail .evidence-item {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
  }
  #detail .evidence-item a { color: var(--slot-1); text-decoration: none; font-size: 12px; }
  #detail .evidence-item .desc { margin: 4px 0; }
  #detail .evidence-item .src { color: var(--text-muted); font-size: 11px; }

  #canvas-wrap { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; display: block; }
  .edge { stroke-opacity: .55; fill: none; }
  .edge.dim { stroke-opacity: .08; }
  .node circle { stroke: var(--surface-1); stroke-width: 2px; cursor: pointer; }
  .node.dim { opacity: .12; }
  .node text {
    font-size: 10px; fill: var(--text-secondary); pointer-events: none;
    paint-order: stroke; stroke: var(--page); stroke-width: 3px;
  }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none; max-width: 260px;
  }

  #stats {
    position: absolute; bottom: 12px; left: 12px;
    font-size: 11px; color: var(--text-muted);
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    position: relative; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 16px; max-width: 640px; width: 100%; max-height: 84vh;
    overflow-y: auto; padding: 36px 40px; box-shadow: 0 24px 64px rgba(0,0,0,.4);
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px;
    border-radius: 50%; border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .modal-close:hover { background: var(--page); color: var(--text-primary); }
  .modal-eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--slot-1); font-weight: 700; margin-bottom: 12px;
  }
  .modal-title {
    font-size: 23px; font-weight: 700; line-height: 1.35; margin: 0 0 8px;
    text-wrap: balance; color: var(--text-primary);
  }
  .modal-meta {
    font-size: 12px; color: var(--text-muted); margin-bottom: 22px;
    font-variant-numeric: tabular-nums;
  }
  .modal-lead {
    font-size: 15px; font-weight: 500; line-height: 1.65; color: var(--text-primary);
    border-left: 3px solid var(--slot-1); padding: 2px 0 2px 16px; margin-bottom: 26px;
  }
  .modal-body { font-size: 14px; line-height: 1.8; color: var(--text-secondary); }
  .modal-body p { margin: 0 0 16px; max-width: 62ch; }
  .modal-body p.personal-view {
    background: var(--page); border-radius: 10px; padding: 14px 18px;
    border-left: 3px solid var(--slot-7); color: var(--text-primary); max-width: none;
  }
  .modal-source-link {
    display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 500;
    color: var(--slot-1); text-decoration: none;
  }
  .modal-source-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>科技产业关系图谱</h1>
    <div class="sub" id="generated-at"></div>
    <div id="sector-tabs"></div>
    <div id="sector-signals"></div>
    <div id="search-wrap">
      <input type="search" id="search" placeholder="搜索公司 / 技术 / 机构…" autocomplete="off" />
      <div id="search-suggestions"></div>
    </div>
    <div class="section-title">关系类型</div>
    <div class="chip-row" id="edge-type-filters"></div>
    <div class="section-title">实体类型</div>
    <div class="chip-row" id="node-type-filters"></div>
    <div id="detail"><div class="placeholder">点击一个节点或连线查看详情</div></div>
  </div>
  <div id="canvas-wrap">
    <svg id="svg"></svg>
    <div id="tooltip"></div>
    <div id="stats"></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-panel">
    <button id="modal-close" class="modal-close" aria-label="关闭">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const GRAPH = __GRAPH_DATA__;

const NODE_TYPE_COLOR = {
  company: "var(--slot-1)",
  technology: "var(--slot-3)",
  institution: "var(--slot-4)",
  product: "var(--slot-7)",
  person: "var(--slot-5)",
};
const NODE_TYPE_LABEL = {
  company: "公司", technology: "技术", institution: "机构", product: "产品", person: "人物",
};

const EDGE_TYPE_COLOR = {
  partnership: "var(--slot-1)",
  competition: "var(--slot-8)",
  investment: "var(--slot-3)",
  acquisition: "var(--slot-7)",
  supplier: "var(--slot-4)",
  customer: "var(--slot-6)",
  research_collaboration: "var(--slot-2)",
  subsidiary: "var(--slot-5)",
};
const EDGE_TYPE_LABEL = {
  partnership: "合作", competition: "竞争", investment: "投资", acquisition: "收购",
  supplier: "供应", customer: "客户", research_collaboration: "研究合作", subsidiary: "母子公司",
};

const CANONICAL_SECTORS = ["机器人板块", "AI板块", "能源板块", "量子计算板块", "太空经济板块", "edge AI板块"];

const nodeEntries = Object.entries(GRAPH.nodes || {});
const nodes = nodeEntries.map(([key, n]) => ({
  id: key, name: n.name, type: n.type, sectors: n.sectors || [],
  sectorTags: n.sector_tags || [], hot: n.hot || null, ticker: n.ticker || null,
  mentions: n.mentions || 1, first_seen: n.first_seen, last_seen: n.last_seen,
  x: Math.random() * 800 - 400, y: Math.random() * 600 - 300, vx: 0, vy: 0,
}));
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = (GRAPH.edges || [])
  .filter(e => nodeById[e.source] && nodeById[e.target])
  .map(e => ({ source: e.source, target: e.target, type: e.type, evidence: e.evidence || [] }));

document.getElementById("generated-at").textContent =
  `${nodes.length} 个实体 · ${links.length} 条关系 · 生成于 ${GRAPH.generated_at || ""}`;
document.getElementById("stats").textContent = "拖动节点调整位置 · 滚轮缩放 · 点击查看详情";

// ---------- sector switcher ----------
let currentSector = null; // null = 全部

function renderSectorTabs() {
  const container = document.getElementById("sector-tabs");
  container.innerHTML = "";
  const allTab = document.createElement("div");
  allTab.className = "sector-tab" + (currentSector === null ? " active" : "");
  allTab.textContent = "全部";
  allTab.addEventListener("click", () => { currentSector = null; onSectorChange(); });
  container.appendChild(allTab);

  CANONICAL_SECTORS.forEach(sector => {
    const tab = document.createElement("div");
    tab.className = "sector-tab" + (currentSector === sector ? " active" : "");
    tab.textContent = sector;
    tab.addEventListener("click", () => { currentSector = sector; onSectorChange(); });
    container.appendChild(tab);
  });
}

function formatDate(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toISOString().slice(0, 10);
}

function mdToHtml(md) {
  const escaped = (md || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return escaped
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(p => p && p !== "---")
    .map(p => p.startsWith("个人看法") ? `<p class="personal-view">${p}</p>` : `<p>${p}</p>`)
    .join("");
}

function renderSectorSignals() {
  const container = document.getElementById("sector-signals");
  if (!currentSector) { container.innerHTML = ""; return; }
  const signals = (GRAPH.sector_signals || []).filter(s => s.sector === currentSector);
  if (!signals.length) {
    container.innerHTML = `<div class="section-title">${currentSector} 近期信号</div><div class="signal-item" style="cursor:default">暂无记录</div>`;
    return;
  }
  const sorted = signals.slice().sort((a, b) => (b.published || "").localeCompare(a.published || ""));
  container.innerHTML = `<div class="section-title">${currentSector} 近期信号(${sorted.length})</div>` +
    sorted.map((s, i) => `
      <div class="signal-item" data-idx="${i}">
        <div class="signal-date">${formatDate(s.published)}${s.source_name ? " · " + s.source_name : ""}</div>
        <div class="signal-title">${s.article_title || currentSector}</div>
        <div class="signal-desc">${s.description}</div>
        <div class="signal-cta">${s.article_body ? "查看完整分析 →" : (s.article_url ? "查看原文 →" : "")}</div>
      </div>
    `).join("");
  container.querySelectorAll(".signal-item[data-idx]").forEach(el => {
    el.addEventListener("click", () => openSignalModal(sorted[parseInt(el.dataset.idx, 10)]));
  });
}

function openSignalModal(signal) {
  const bodyHtml = signal.article_body
    ? mdToHtml(signal.article_body)
    : `<p>${signal.description}</p>`;
  document.getElementById("modal-content").innerHTML = `
    <div class="modal-eyebrow">${signal.sector}${signal.source_name ? " · " + signal.source_name : ""}</div>
    <h2 class="modal-title">${signal.article_title || signal.sector}</h2>
    <div class="modal-meta">${formatDate(signal.published)}</div>
    <div class="modal-lead">${signal.description}</div>
    <div class="modal-body">${bodyHtml}</div>
    ${signal.article_url ? `<a class="modal-source-link" href="${signal.article_url}" target="_blank" rel="noopener">查看原文 →</a>` : ""}
  `;
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function onSectorChange() {
  renderSectorTabs();
  renderSectorSignals();
  applyFilters();
}

// ---------- filters ----------
const activeEdgeTypes = new Set(Object.keys(EDGE_TYPE_COLOR));
const activeNodeTypes = new Set(Object.keys(NODE_TYPE_COLOR));
renderSectorTabs();
renderSectorSignals();

function buildChips(container, entries, colorMap, activeSet, onChange) {
  entries.forEach(([key, label]) => {
    const chip = document.createElement("div");
    chip.className = "chip active";
    chip.style.color = colorMap[key] || "var(--text-secondary)";
    chip.innerHTML = `<span class="dot" style="background:${colorMap[key] || "var(--text-muted)"}"></span>${label}`;
    chip.addEventListener("click", () => {
      if (activeSet.has(key)) { activeSet.delete(key); chip.classList.remove("active"); }
      else { activeSet.add(key); chip.classList.add("active"); }
      onChange();
    });
    container.appendChild(chip);
  });
}
buildChips(document.getElementById("edge-type-filters"),
  Object.entries(EDGE_TYPE_LABEL), EDGE_TYPE_COLOR, activeEdgeTypes, applyFilters);
buildChips(document.getElementById("node-type-filters"),
  Object.entries(NODE_TYPE_LABEL), NODE_TYPE_COLOR, activeNodeTypes, applyFilters);

let searchTerm = "";
const searchInput = document.getElementById("search");
const suggestionsBox = document.getElementById("search-suggestions");

function renderSuggestions() {
  if (!searchTerm) { suggestionsBox.style.display = "none"; return; }
  const matches = nodes
    .filter(n => n.name.toLowerCase().includes(searchTerm) && (!currentSector || n.sectorTags.includes(currentSector)))
    .slice(0, 8);
  if (!matches.length) { suggestionsBox.style.display = "none"; return; }
  suggestionsBox.innerHTML = matches.map((n, i) => `
    <div class="suggestion-item" data-idx="${i}">
      <span class="dot" style="background:${NODE_TYPE_COLOR[n.type] || "var(--text-muted)"}"></span>
      ${n.name}
      <span class="type-label">${NODE_TYPE_LABEL[n.type] || n.type}</span>
    </div>
  `).join("");
  suggestionsBox.style.display = "block";
  suggestionsBox.querySelectorAll(".suggestion-item").forEach(el => {
    el.addEventListener("click", () => {
      const n = matches[parseInt(el.dataset.idx, 10)];
      searchInput.value = n.name;
      searchTerm = n.name.toLowerCase();
      suggestionsBox.style.display = "none";
      applyFilters();
      showNodeDetail(n);
      focusOnNode(n);
    });
  });
}

function focusOnNode(n) {
  viewX = -n.x * viewScale;
  viewY = -n.y * viewScale;
  applyTransform();
}

searchInput.addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
  renderSuggestions();
});
searchInput.addEventListener("focus", renderSuggestions);
document.addEventListener("click", (e) => {
  if (e.target !== searchInput && !suggestionsBox.contains(e.target)) {
    suggestionsBox.style.display = "none";
  }
});

// ---------- svg setup ----------
const svg = document.getElementById("svg");
const svgNS = "http://www.w3.org/2000/svg";
const viewport = document.createElementNS(svgNS, "g");
svg.appendChild(viewport);

const linkEls = links.map(l => {
  const el = document.createElementNS(svgNS, "line");
  el.setAttribute("class", "edge");
  el.setAttribute("stroke", EDGE_TYPE_COLOR[l.type] || "var(--text-muted)");
  el.setAttribute("stroke-width", "1.6");
  el.addEventListener("click", (ev) => { ev.stopPropagation(); showEdgeDetail(l); });
  el.addEventListener("mouseenter", (ev) => showTooltip(ev, `${nodeById[l.source].name} → ${nodeById[l.target].name}<br><span style="color:var(--text-muted)">${EDGE_TYPE_LABEL[l.type] || l.type}</span>`));
  el.addEventListener("mouseleave", hideTooltip);
  el.addEventListener("mousemove", moveTooltip);
  viewport.appendChild(el);
  return el;
});

function radiusFor(n) { return 6 + Math.min(14, Math.sqrt(n.mentions) * 4); }

const nodeGroups = nodes.map(n => {
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("class", "node");
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("r", radiusFor(n));
  circle.setAttribute("fill", NODE_TYPE_COLOR[n.type] || "var(--text-muted)");
  const text = document.createElementNS(svgNS, "text");
  text.textContent = n.name;
  text.setAttribute("x", radiusFor(n) + 4);
  text.setAttribute("y", 4);
  g.appendChild(circle);
  g.appendChild(text);
  g.addEventListener("click", (ev) => { ev.stopPropagation(); showNodeDetail(n); });
  g.addEventListener("mouseenter", (ev) => showTooltip(ev, `<b>${n.name}</b>${n.ticker ? ` <span style="color:var(--text-muted)">(${n.ticker})</span>` : ""}${n.hot ? `<span class="badge ${n.hot}">${n.hot === "hot" ? "热门" : "冷门"}</span>` : ""}<br><span style="color:var(--text-muted)">${NODE_TYPE_LABEL[n.type] || n.type} · 提及 ${n.mentions} 次</span>`));
  g.addEventListener("mouseleave", hideTooltip);
  g.addEventListener("mousemove", moveTooltip);
  makeDraggable(g, n);
  viewport.appendChild(g);
  return g;
});

svg.addEventListener("click", () => {
  document.getElementById("detail").innerHTML = '<div class="placeholder">点击一个节点或连线查看详情</div>';
  highlightNone();
});

// ---------- force simulation (self-contained, no external deps) ----------
const idToIndex = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
function step() {
  const REPULSION = 2200, SPRING = 0.02, SPRING_LEN = 90, CENTER = 0.006, DAMPING = 0.85;
  for (let i = 0; i < nodes.length; i++) {
    let fx = 0, fy = 0;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const distSq = Math.max(dx * dx + dy * dy, 30);
      const force = REPULSION / distSq;
      fx += (dx / Math.sqrt(distSq)) * force;
      fy += (dy / Math.sqrt(distSq)) * force;
    }
    fx += -nodes[i].x * CENTER;
    fy += -nodes[i].y * CENTER;
    nodes[i].fx = fx; nodes[i].fy = fy;
  }
  for (const l of links) {
    const a = nodeById[l.source], b = nodeById[l.target];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (dist - SPRING_LEN) * SPRING;
    const fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.fx += fx; a.fy += fy;
    b.fx -= fx; b.fy -= fy;
  }
  for (const n of nodes) {
    if (n.dragging) continue;
    n.vx = (n.vx + n.fx) * DAMPING;
    n.vy = (n.vy + n.fy) * DAMPING;
    n.x += n.vx;
    n.y += n.vy;
  }
  render();
}

function render() {
  links.forEach((l, i) => {
    const a = nodeById[l.source], b = nodeById[l.target];
    const el = linkEls[i];
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  });
  nodes.forEach((n, i) => {
    nodeGroups[i].setAttribute("transform", `translate(${n.x},${n.y})`);
  });
}

let tickCount = 0;
const simInterval = setInterval(() => {
  step();
  tickCount++;
  if (tickCount > 260) clearInterval(simInterval);
}, 16);

// ---------- pan / zoom ----------
let viewX = 0, viewY = 0, viewScale = 1;
function applyTransform() {
  const w = svg.clientWidth, h = svg.clientHeight;
  viewport.setAttribute("transform",
    `translate(${w / 2 + viewX},${h / 2 + viewY}) scale(${viewScale})`);
}
applyTransform();
window.addEventListener("resize", applyTransform);

let panning = false, panStart = null;
svg.addEventListener("mousedown", (e) => {
  if (e.target === svg) { panning = true; panStart = { x: e.clientX - viewX, y: e.clientY - viewY }; }
});
window.addEventListener("mousemove", (e) => {
  if (panning) { viewX = e.clientX - panStart.x; viewY = e.clientY - panStart.y; applyTransform(); }
});
window.addEventListener("mouseup", () => { panning = false; });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  viewScale = Math.min(3, Math.max(0.2, viewScale * (e.deltaY > 0 ? 0.9 : 1.1)));
  applyTransform();
}, { passive: false });

function makeDraggable(g, n) {
  g.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    n.dragging = true;
    const move = (ev) => {
      const rect = svg.getBoundingClientRect();
      n.x = (ev.clientX - rect.left - rect.width / 2 - viewX) / viewScale;
      n.y = (ev.clientY - rect.top - rect.height / 2 - viewY) / viewScale;
      render();
    };
    const up = () => {
      n.dragging = false;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

// ---------- tooltip ----------
const tooltip = document.getElementById("tooltip");
function showTooltip(e, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(e);
}
function moveTooltip(e) {
  const wrap = document.getElementById("canvas-wrap").getBoundingClientRect();
  tooltip.style.left = (e.clientX - wrap.left + 14) + "px";
  tooltip.style.top = (e.clientY - wrap.top + 14) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

// ---------- detail panel ----------
function showNodeDetail(n) {
  highlightNode(n.id);
  const relatedEdges = links.filter(l => l.source === n.id || l.target === n.id);
  const evidenceHtml = relatedEdges.map(l => {
    const other = nodeById[l.source === n.id ? l.target : l.source];
    const dirLabel = EDGE_TYPE_LABEL[l.type] || l.type;
    return `<div class="evidence-item">
      <div><b>${dirLabel}</b> — ${other.name}</div>
      ${l.evidence.slice(-3).map(ev => `
        <div class="desc">${ev.description || ""}</div>
        <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""}</div>
      `).join("")}
    </div>`;
  }).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${n.name}${n.ticker ? ` <span style="color:var(--text-muted); font-weight:normal;">(${n.ticker})</span>` : ""}${n.hot ? `<span class="badge ${n.hot}">${n.hot === "hot" ? "热门" : "冷门"}</span>` : ""}</h2>
    <div class="meta">${NODE_TYPE_LABEL[n.type] || n.type}${n.sectorTags.length ? " · " + n.sectorTags.join(", ") : (n.sectors.length ? " · " + n.sectors.join(", ") : "")} · 提及 ${n.mentions} 次</div>
    ${evidenceHtml || '<div class="placeholder">暂无关系记录</div>'}
  `;
}

function showEdgeDetail(l) {
  const a = nodeById[l.source], b = nodeById[l.target];
  highlightNode(null, l);
  const evidenceHtml = l.evidence.map(ev => `
    <div class="evidence-item">
      <div class="desc">${ev.description || ""}</div>
      <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""} · ${ev.published || ""}</div>
    </div>
  `).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${a.name} ↔ ${b.name}</h2>
    <div class="meta">${EDGE_TYPE_LABEL[l.type] || l.type}</div>
    ${evidenceHtml}
  `;
}

function highlightNode(nodeId, edge) {
  let neighborIds = new Set();
  if (nodeId) {
    neighborIds.add(nodeId);
    links.forEach(l => {
      if (l.source === nodeId) neighborIds.add(l.target);
      if (l.target === nodeId) neighborIds.add(l.source);
    });
  } else if (edge) {
    neighborIds.add(edge.source);
    neighborIds.add(edge.target);
  }
  nodeGroups.forEach((g, i) => {
    g.classList.toggle("dim", neighborIds.size > 0 && !neighborIds.has(nodes[i].id));
  });
  linkEls.forEach((el, i) => {
    const l = links[i];
    const relevant = edge ? l === edge : (l.source === nodeId || l.target === nodeId);
    el.classList.toggle("dim", neighborIds.size > 0 && !relevant);
  });
}
function highlightNone() {
  nodeGroups.forEach(g => g.classList.remove("dim"));
  linkEls.forEach(el => el.classList.remove("dim"));
}

// ---------- filters ----------
function applyFilters() {
  nodes.forEach((n, i) => {
    const typeOk = activeNodeTypes.has(n.type);
    const searchOk = !searchTerm || n.name.toLowerCase().includes(searchTerm);
    const sectorOk = !currentSector || n.sectorTags.includes(currentSector);
    nodeGroups[i].style.display = (typeOk && searchOk && sectorOk) ? "" : "none";
  });
  links.forEach((l, i) => {
    const typeOk = activeEdgeTypes.has(l.type);
    const endsVisible = nodeGroups[idToIndex[l.source]].style.display !== "none" &&
                         nodeGroups[idToIndex[l.target]].style.display !== "none";
    linkEls[i].style.display = (typeOk && endsVisible) ? "" : "none";
  });
}
