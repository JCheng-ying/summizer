escription": "GEN-1跨执行器预训练和Flexion的sim-to-real零样本迁移,分别打通了具身智能两条降本路径,降低通用人形/灵巧手机器人的研发和部署门槛", "article_title": "Video Friday: An Italian Humanoid Comes to Life", "article_url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "source_name": "IEEE Spectrum - Robotics", "published": "Fri, 24 Jul 2026", "added_at": "2026-08-03T06:11:52.795529+00:00", "article_body": "这篇文章是 IEEE Spectrum 每周固定栏目的视频集锦,本身不是单一深度报道,而是十几家机器人公司这一周各自放出的短视频加一两句话说明。放在一起看,反而能看出具身智能(Physical AI)这个赛道现在同时在往哪几个方向走。\n\n文章提到的第一条值得展开讲的是机器人公司 Generalist 展示的 GEN-1。这是一个\"具身基础模型\"(embodied foundation model),文章指出它现在开始支持从五指灵巧手到各种专用工具在内的多种末端执行器,而不是只针对一种机械手训练。这个思路和今天大语言模型的训练范式其实是一致的:GPT 是先在整个互联网上预训练,再针对医学、法律等具体领域微调;GEN-1 则是把\"手\"本身当成不同的接口,先在大量不同形态的抓取任务上做预训练,让模型学到一种跨手型都能迁移的\"物理常识\",再针对具体的手去微调。文章还提到,这条思路背后的逻辑是,扩大预训练阶段接触的执行器种类,本身就是一种 scaling——不是靠更多数据或更大模型,而是靠更多样的身体形态。\n\n文章提到的第二条是仿真机器人公司 Flexion,联合 Niantic Spatial 和 Nvidia 做的一套流程:用普通设备扫描一个真实场地,重建成高保真的三维场景(用的是\"高斯溅射\"技术,一种能快速生成照片级三维模型的方法),然后在这个虚拟场景里做大规模并行强化学习训练,训练出来的策略可以直接搬到真实机器人和真实场地上用,不需要额外调整,文章称之为\"零样本迁移\"。这一步本质上是在解决机器人训练里一个老问题——仿真和真实世界之间的差距(sim-to-real gap)。过去这个差距通常要靠在真实环境里再做大量微调来弥补,如果高保真重建加并行仿真训练真的能把这个差距填平,机器人部署到一个新场地的成本会明显下降。\n\n个人看法:这两条放在一起看,其实反映的是具身智能现在两条并行的降本路径,背后是两个不同的瓶颈。GEN-1 卡住的瓶颈是\"每换一种手就要重新训练一个模型\",它解决的方式是跨执行器预训练;Flexion 这套流程卡住的瓶颈是\"仿真里练好的策略搬不到真实场地\",它解决的方式是高保真三维重建加并行仿真训练。这两个瓶颈如果都被打通,受益的首先是机器人板块本身——研发和部署成本下降,通用人形/灵巧手机器人商业化的门槛会往下移;其次间接利好 AI 板块里做算力和仿真平台的公司(Flexion 这类公司本质上是在用 Nvidia 的基础设施做训练,不管最后哪家仿真机器人公司跑出来,Nvidia 这一层大概率都是受益方)。但这两件事目前都还只是企业自己放出的演示视频,原文没有给任何量化的成功率或基准测试数据,离能不能规模化复现还有距离,只能持续跟踪。\n\n文章后面提到的几条商业化进展相对更实打实一些。无人机公司 Wing(隶属 Alphabet)提到自 2026 年 2 月起,已经在为英国西南伦敦病理科(South West London Pathology)执行加急医疗样本配送,速度比地面运输快最多 85%,这是无人机配送从试点走向常态化医疗物流的一个具体案例。自动驾驶卡车公司 Aurora 则展示了下一代 Aurora Driver 平台,提出的目标是让硬件寿命达到一百万英里、成本降低一半——如果这些数字能兑现,说明自动驾驶卡车这条赛道的单位经济模型正在往好的方向走,而不是停留在示范运营阶段。\n\n个人看法:把这一整期集锦串起来看,受益的层次其实是分开的,对应的板块也不完全一样。具身基础模型和仿真训练这一层(Generalist、Flexion)主要利好**机器人板块**,顺带利好**AI 板块**里做算力和仿真平台的公司;Wing、Aurora 这一层不是技术瓶颈突破,而是已经跑通商业模式、进入规模化部署阶段的运营效率改善,更偏**机器人板块**里\"应用已经落地\"的那一档,和上面那层\"还在研发降本\"的公司完全不是一个阶段。现在还很难判断具身基础模型这条路线什么时候能追上无人机配送、自动驾驶卡车这种已经在真实场景里跑单量的成熟度,只能说这一期视频集锦本身就是一个很好的\"赛道分层\"样本——同一个大主题下,不同公司实际所处的商业化阶段可能差着好几年。这一点也是后面几篇文章会反复出现的线索,值得对照着看。"}, {"sector": "AI板块", "description": "Flexion的仿真训练依赖Nvidia算力和仿真平台基础设施,不管哪家具身智能公司跑出来,这一层大概率都是受益方", "article_title": "Video Friday: An Italian Humanoid Comes to Life", "article_url": "https://spectrum.ieee.org/video-friday-physical-ai-robotics", "source_name": "IEEE Spectrum - Robotics", "published": "Fri, 24 Jul 2026", "added_at": "2026-08-03T06:11:52.796171+00:00", "article_body": "这篇文章是 IEEE Spectrum 每周固定栏目的视频集锦,本身不是单一深度报道,而是十几家机器人公司这一周各自放出的短视频加一两句话说明。放在一起看,反而能看出具身智能(Physical AI)这个赛道现在同时在往哪几个方向走。\n\n文章提到的第一条值得展开讲的是机器人公司 Generalist 展示的 GEN-1。这是一个\"具身基础模型\"(embodied foundation model),文章指出它现在开始支持从五指灵巧手到各种专用工具在内的多种末端执行器,而不是只针对一种机械手训练。这个思路和今天大语言模型的训练范式其实是一致的:GPT 是先在整个互联网上预训练,再针对医学、法律等具体领域微调;GEN-1 则是把\"手\"本身当成不同的接口,先在大量不同形态的抓取任务上做预训练,让模型学到一种跨手型都能迁移的\"物理常识\",再针对具体的手去微调。文章还提到,这条思路背后的逻辑是,扩大预训练阶段接触的执行器种类,本身就是一种 scaling——不是靠更多数据或更大模型,而是靠更多样的身体形态。\n\n文章提到的第二条是仿真机器人公司 Flexion,联合 Niantic Spatial 和 Nvidia 做的一套流程:用普通设备扫描一个真实场地,重建成高保真的三维场景(用的是\"高斯溅射\"技术,一种能快速生成照片级三维模型的方法),然后在这个虚拟场景里做大规模并行强化学习训练,训练出来的策略可以直接搬到真实机器人和真实场地上用,不需要额外调整,文章称之为\"零样本迁移\"。这一步本质上是在解决机器人训练里一个老问题——仿真和真实世界之间的差距(sim-to-real gap)。过去这个差距通常要靠在真实环境里再做大量微调来弥补,如果高保真重建加并行仿真训练真的能把这个差距填平,机器人部署到一个新场地的成本会明显下降。\n\n个人看法:这两条放在一起看,其实反映的是具身智能现在两条并行的降本路径,背后是两个不同的瓶颈。GEN-1 卡住的瓶颈是\"每换一种手就要重新训练一个模型\",它解决的方式是跨执行器预训练;Flexion 这套流程卡住的瓶颈是\"仿真里练好的策略搬不到真实场地\",它解决的方式是高保真三维重建加并行仿真训练。这两个瓶颈如果都被打通,受益的首先是机器人板块本身——研发和部署成本下降,通用人形/灵巧手机器人商业化的门槛会往下移;其次间接利好 AI 板块里做算力和仿真平台的公司(Flexion 这类公司本质上是在用 Nvidia 的基础设施做训练,不管最后哪家仿真机器人公司跑出来,Nvidia 这一层大概率都是受益方)。但这两件事目前都还只是企业自己放出的演示视频,原文没有给任何量化的成功率或基准测试数据,离能不能规模化复现还有距离,只能持续跟踪。\n\n文章后面提到的几条商业化进展相对更实打实一些。无人机公司 Wing(隶属 Alphabet)提到自 2026 年 2 月起,已经在为英国西南伦敦病理科(South West London Pathology)执行加急医疗样本配送,速度比地面运输快最多 85%,这是无人机配送从试点走向常态化医疗物流的一个具体案例。自动驾驶卡车公司 Aurora 则展示了下一代 Aurora Driver 平台,提出的目标是让硬件寿命达到一百万英里、成本降低一半——如果这些数字能兑现,说明自动驾驶卡车这条赛道的单位经济模型正在往好的方向走,而不是停留在示范运营阶段。\n\n个人看法:把这一整期集锦串起来看,受益的层次其实是分开的,对应的板块也不完全一样。具身基础模型和仿真训练这一层(Generalist、Flexion)主要利好**机器人板块**,顺带利好**AI 板块**里做算力和仿真平台的公司;Wing、Aurora 这一层不是技术瓶颈突破,而是已经跑通商业模式、进入规模化部署阶段的运营效率改善,更偏**机器人板块**里\"应用已经落地\"的那一档,和上面那层\"还在研发降本\"的公司完全不是一个阶段。现在还很难判断具身基础模型这条路线什么时候能追上无人机配送、自动驾驶卡车这种已经在真实场景里跑单量的成熟度,只能说这一期视频集锦本身就是一个很好的\"赛道分层\"样本——同一个大主题下,不同公司实际所处的商业化阶段可能差着好几年。这一点也是后面几篇文章会反复出现的线索,值得对照着看。"}, {"sector": "edge AI板块", "description": "康奈尔理工展示用光直接改写芯片内存,目标是降低边缘AI设备(机器人、自动驾驶等)更新模型参数的能耗,是边缘AI硬件的早期技术信号", "article_title": "Optical Tech Would Update a Robot's AI on the Fly", "article_url": "https://spectrum.ieee.org/ai-in-robotics", "source_name": "IEEE Spectrum - Robotics", "published": "Sun, 26 Jul 2026", "added_at": "2026-08-03T06:11:52.796539+00:00", "article_body": "这篇文章讨论的是边缘 AI 的一个基础性瓶颈:芯片本身装不下 AI 模型的全部参数,数据得不断从旁边的内存条(DRAM)搬过来,这个搬运过程本身就是主要的耗电大头。文章指出,今天的 AI 芯片没有足够的片上空间放下模型全部参数,只能把参数存在 DRAM 里,再通过电气连接不断读取——康奈尔理工(Cornell Tech)的研究者 Jae-sun Seo 提到,这种芯片和 DRAM 之间的电气连接,正是系统规模扩大时最主要的成本和效率瓶颈之一。\n\n文章提出的方案是用光直接改写芯片内存,而不是走传统的电气连接。具体做法是把芯片里一部分静态内存单元(SRAM)替换成能感光的光电二极管,发射端用光信号照射这些单元,光产生的电流会直接翻转对应内存位的 0/1 状态——相当于跳过了\"光转电信号再写入\"这个中间的模拟转换环节,做成了纯数字的光学通信。文章强调这条路径的意义在于:光本身传输数据的带宽高、损耗低,过去限制光学方案实际落地的,是接收端那套耗电的模拟电路,而这次的设计恰好把这部分省掉了。\n\n文章也指出了这项技术目前的两个明显限制。第一是这套系统现在只是实验室的概念验证,发射端只能显示一个固定不变的 14x14 光点矩阵,离每秒能变化几百万次、达到 Gbps 级实际可用速度还有距离。第二,受访的密歇根大学电子与计算机工程系主任 Dennis Sylvester(未参与这项研究)提出了一个更根本的问题:感光内存单元的物理尺寸比常规 SRAM 单元大,这意味着同样芯片面积能塞进的内存更少——这个体积上的劣势,可能会把光学方案在能耗上省下来的优势重新吃掉。研究团队的回应是正在通过优化晶体管和电路尺寸、利用 CMOS 工艺缩小单元体积来解决这个问题。\n\n个人看法:这篇文章和前一篇 Video Friday 里 Generalist 展示的 GEN-1 具身基础模型放在一起看,其实是同一个问题的两端。GEN-1 这类具身基础模型要在多种末端执行器上做泛化,参数量大概率只会越堆越大;而这篇文章讲的正是\"参数变大之后,怎么把这些参数高效地送进芯片、送到机器人本体上\"这个物理层问题。换句话说,前一篇是模型能力在往前走,这一篇是能不能把这个能力真正塞进一个功耗、体积都受限的机器人身体里——这是具身智能从实验室模型走向能装进真实机器人本体这条路上,一个经常被忽略但同样关键的约束。\n\n文章完全没有提到任何公司参与或商业化时间表,目前是纯学术研究阶段(康奈尔理工做研究,密歇根大学的专家做第三方点评),原文也没有披露专利或融资信息。个人看法:这篇文章的瓶颈定位很清楚——不是模型能力不够,而是\"把参数从内存搬到芯片\"这个物理层的能耗成本,谁能解决这个瓶颈,谁就是受益方。目前挂得上的板块是**edge AI 板块**(这本身就是一篇边缘 AI 硬件论文)和**能源板块**(核心诉求就是降低数据中心和边缘设备的能耗),间接也和**机器人板块**相关,因为机器人本体正是文章点名的边缘 AI 应用场景之一。但目前还谈不上有具体标的可以跟踪,更适合作为一个\"关注列表\"条目放着——如果未来看到具名的芯片公司或机器人公司跟进这条光学内存路线,或者感光单元体积的问题被实质性解决,会是这项技术从实验室走向产业化的关键节点,值得留意后续是否出现这类消息。"}, {"sector": "能源板块", "description": "核心诉求是降低数据中心和边缘设备的AI推理/更新能耗,和芯片-内存搬运的能耗瓶颈直接相关", "article_title": "Optical Tech Would Update a Robot's AI on the Fly", "article_url": "https://spectrum.ieee.org/ai-in-robotics", "source_name": "IEEE Spectrum - Robotics", "published": "Sun, 26 Jul 2026", "added_at": "2026-08-03T06:11:52.796900+00:00", "article_body": "这篇文章讨论的是边缘 AI 的一个基础性瓶颈:芯片本身装不下 AI 模型的全部参数,数据得不断从旁边的内存条(DRAM)搬过来,这个搬运过程本身就是主要的耗电大头。文章指出,今天的 AI 芯片没有足够的片上空间放下模型全部参数,只能把参数存在 DRAM 里,再通过电气连接不断读取——康奈尔理工(Cornell Tech)的研究者 Jae-sun Seo 提到,这种芯片和 DRAM 之间的电气连接,正是系统规模扩大时最主要的成本和效率瓶颈之一。\n\n文章提出的方案是用光直接改写芯片内存,而不是走传统的电气连接。具体做法是把芯片里一部分静态内存单元(SRAM)替换成能感光的光电二极管,发射端用光信号照射这些单元,光产生的电流会直接翻转对应内存位的 0/1 状态——相当于跳过了\"光转电信号再写入\"这个中间的模拟转换环节,做成了纯数字的光学通信。文章强调这条路径的意义在于:光本身传输数据的带宽高、损耗低,过去限制光学方案实际落地的,是接收端那套耗电的模拟电路,而这次的设计恰好把这部分省掉了。\n\n文章也指出了这项技术目前的两个明显限制。第一是这套系统现在只是实验室的概念验证,发射端只能显示一个固定不变的 14x14 光点矩阵,离每秒能变化几百万次、达到 Gbps 级实际可用速度还有距离。第二,受访的密歇根大学电子与计算机工程系主任 Dennis Sylvester(未参与这项研究)提出了一个更根本的问题:感光内存单元的物理尺寸比常规 SRAM 单元大,这意味着同样芯片面积能塞进的内存更少——这个体积上的劣势,可能会把光学方案在能耗上省下来的优势重新吃掉。研究团队的回应是正在通过优化晶体管和电路尺寸、利用 CMOS 工艺缩小单元体积来解决这个问题。\n\n个人看法:这篇文章和前一篇 Video Friday 里 Generalist 展示的 GEN-1 具身基础模型放在一起看,其实是同一个问题的两端。GEN-1 这类具身基础模型要在多种末端执行器上做泛化,参数量大概率只会越堆越大;而这篇文章讲的正是\"参数变大之后,怎么把这些参数高效地送进芯片、送到机器人本体上\"这个物理层问题。换句话说,前一篇是模型能力在往前走,这一篇是能不能把这个能力真正塞进一个功耗、体积都受限的机器人身体里——这是具身智能从实验室模型走向能装进真实机器人本体这条路上,一个经常被忽略但同样关键的约束。\n\n文章完全没有提到任何公司参与或商业化时间表,目前是纯学术研究阶段(康奈尔理工做研究,密歇根大学的专家做第三方点评),原文也没有披露专利或融资信息。个人看法:这篇文章的瓶颈定位很清楚——不是模型能力不够,而是\"把参数从内存搬到芯片\"这个物理层的能耗成本,谁能解决这个瓶颈,谁就是受益方。目前挂得上的板块是**edge AI 板块**(这本身就是一篇边缘 AI 硬件论文)和**能源板块**(核心诉求就是降低数据中心和边缘设备的能耗),间接也和**机器人板块**相关,因为机器人本体正是文章点名的边缘 AI 应用场景之一。但目前还谈不上有具体标的可以跟踪,更适合作为一个\"关注列表\"条目放着——如果未来看到具名的芯片公司或机器人公司跟进这条光学内存路线,或者感光单元体积的问题被实质性解决,会是这项技术从实验室走向产业化的关键节点,值得留意后续是否出现这类消息。"}, {"sector": "机器人板块", "description": "材料自带触觉感知方案绕开指尖空间限制,如果耐久性问题解决,可降低机械手指尖传感器成本和集成复杂度,是机器人感知层的精细化进展", "article_title": "Robot Finger Feels in Color", "article_url": "https://spectrum.ieee.org/robot-finger", "source_name": "IEEE Spectrum - Robotics", "published": "Tue, 28 Jul 2026", "added_at": "2026-08-03T06:11:52.797234+00:00", "article_body": "这篇文章讨论的是机器人触觉感知一直以来的一个硬约束:指尖空间太小,塞不下足够多的传感器,导致机器人始终没办法像人手一样细腻地感知接触面的形貌和压力分布。伦敦玛丽女王大学联合意大利多所高校的团队,提出了一种绕开这个空间限制的新方案。\n\n文章指出,传统触觉传感方案大多是在指尖里排布很多个独立的压力点(taxel),点数越多分辨率越高,但受限于指尖的物理空间,taxel 数量做不了太多,只能拼出比较粗糙的形貌图。这个团队的思路是反过来:不在指尖里塞传感器阵列,而是让**材料本身**具备感知能力。他们用一种叫\"布拉格反射层\"的材料,当它受到挤压变形时,会反射出不同波长的光——受力小的时候偏红,受力增大逐渐偏绿,最大受力时偏蓝。指尖内部只需要一颗摄像头和一颗 LED:灯光透过材料照出去,摄像头读取反射回来的颜色,就能倒推出指尖每个位置的受力大小和表面形状。文章提到,这套方案最终做到了 100 微米的分辨率,而且没有额外的计算延迟。\n\n这条技术路线的关键突破,文章总结为\"把传感能力做进材料本身,而不是靠taxel阵列去逼近\"。用于对照的例子是,受访的 Shadow Robot(英国历史最悠久的机械手公司之一)总监 Rich Walker 提到,目前行业里对机械手指尖到底该用哪种传感方案并没有共识,他直言\"没人知道答案\"——这也是为什么这类新路线的出现,更多是在给行业增加一个可选项,而不是终结某个既有方案。\n\n文章也指出了两个明显的局限。第一是耐久性:反复受力后,硅胶保护层和内部的反射材料可能会磨损或劣化,导致信号失真——这一点受访的 Daimon Robotics(主要做视觉触觉传感)联合创始人 Michael Wang 特别强调了,他认为软材料传感器在长期高频使用场景下的耐久性,目前还没有看到足够成熟的方案。第二是这套系统目前只能感知\"贴合在平面上\"的接触,还无法很好处理不贴合表面的物体,团队表示这是下一步要解决的方向,如果能突破,理论上可以用在需要精确接触建图的手术器械上。\n\n个人看法:这篇文章和 Video Friday 里 Generalist 展示的 GEN-1 具身基础模型,其实是同一层问题的两个不同切面。GEN-1 想做的是让一个模型能适配多种\"手\"这种末端执行器,但模型能学到什么,很大程度上取决于这只手本身能感知到什么信息——如果指尖的触觉传感始终是粗糙的、taxel 数量受限的,那具身基础模型即便再通用,输入端的信息密度也是被卡住的。反过来说,如果这类\"材料自带感知\"的方案能解决耐久性问题、真正走向量产,相当于给下一代具身基础模型提供了一个分辨率高得多的感知接口——这两条线一个在做\"大脑\"的通用化,一个在做\"皮肤\"的精细化,长期看是互相依赖、而不是各自独立的进展。\n\n目前这项技术仍处于实验室原型阶段,团队表示已经在和一些潜在应用公司接触,但原文没有披露任何具名的商业合作、专利或融资信息。个人看法:这篇文章卡住的瓶颈很明确——指尖物理空间限制了传感器数量,材料自带感知是绕开这个瓶颈的一种解法,谁能把这条路线的耐久性问题解决,谁就是受益方。触觉传感这个细分赛道现在没有统一的技术路线共识,材料自带感知只是补充选项之一,不构成对现有视觉触觉传感公司(比如 Daimon Robotics 这类)的直接替代威胁,目前主要挂**机器人板块**——这属于人形/灵巧手机器人\"感知层\"精细化的进展,不涉及能源、算力这些其他板块。如果软材料耐久性问题被实质性解决,理论上可以降低机械手指尖的传感器成本和集成复杂度,值得作为触觉传感供应链成本结构变化的一个早期信号持续观察,尤其留意这项技术什么时候从实验室走向和具体机械手公司的联合测试。"}, {"sector": "机器人板块", "description": "GMEX通过并购快速拼齐社会智能技术栈,反映服务机器人在近距离人机互动场景对语境理解能力的需求正在变成独立技术层", "article_title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "article_url": "https://www.therobotreport.com/gmex-robotics-to-acquire-mediameta-ai-social-intelligence/", "source_name": "The Robot Report - Haptics", "published": "Wed, 29 Jul 2026", "added_at": "2026-08-03T06:11:52.797680+00:00", "article_body": "这篇文章讨论的是机器人\"理解人\"这件事里,除了物理触觉之外的另一层——社会/行为语境的理解。澳大利亚机器人公司 GMEX Robotics(原名 Fitell Corp)宣布收购新加坡 AI 公司 MediaMeta.ai,首期取得 30% 股权并附带业绩对赌条款,目标是把\"社会智能\"建模能力整合进自己面向消费、酒店、教育、医疗、零售等场景的服务机器人产品线。\n\n文章指出,MediaMeta 做的不是物体识别,而是一层\"社会背景数据层\"——捕捉人与人之间互动的模式、结构和行为动态,让 AI 系统能够结合行为数据、文化语境和环境信号去推理、预判并回应人的社交行为。GMEX 方面的表态也印证了这个定位:公司在声明里强调\"人类的体验不是交易性的,而是关系性的、语境化的、深受文化影响的\",希望借助这次收购让自己的机器人\"更好地读懂、解读并回应人的社交信号\"。\n\n交易结构本身值得展开讲一下。文章列出的条款是:GMEX 首期取得 30% 完全稀释后的股权,并有权在后续追加至控股比例;对价是现金加 GMEX 普通股的组合;MediaMeta 被要求在交易完成后五年内实现超过 5260 万美元的营收,达不到目标 GMEX 有权要求调整或部分退款;同时 GMEX 及其子公司获得覆盖相关知识产权、软件、AI 系统、模型和机器人数据的永久、独家、免版税技术授权。这是一种典型的\"低初始成本 + 下行保护\"结构——GMEX 不需要一次性支付全资收购的溢价,就换来了核心技术的永久使用权,同时用营收对赌条款把 MediaMeta 商业化不及预期的风险部分转嫁了回去。\n\n个人看法:这篇文章和前面 Robot Finger 那篇其实是同一个大主题——\"机器人怎么更好地理解人\"——的两个不同侧面。Robot Finger 解决的是物理层面的触觉感知,让机器人\"摸得更准\";GMEX 收购 MediaMeta 解决的是社会/情感层面的语境理解,让机器人\"看懂场合\"。这两者背后其实是同一个判断:随着机器人越来越多进入养老、医疗、零售这类需要和人近距离互动的场景,单纯的物体识别和动作执行已经不够用了,\"理解人\"本身正在变成一个独立的技术层,值得单独投入——无论是靠硬件传感器(触觉),还是靠行为数据建模(社会智能)。\n\n个人看法:这篇文章的瓶颈定位是\"服务机器人在近距离人机互动场景里缺乏社会语境理解能力\",GMEX 选择用并购而不是自研来解决这个瓶颈。如果把这类\"机器人理解人\"的技术栈按受益层次拆开看,第一层是像 MediaMeta 这样做行为/社会语境建模的数据和算法公司,直接受益,但这一层公司大多是未上市的早期创业公司,缺乏独立可验证的财务数据;第二层是像 GMEX 这样的机器人本体公司,通过并购快速拼齐技术栈而不是自研,这类公司的看点在于整合执行力和资产负债表能不能撑住频繁的并购动作(原文提到 GMEX 本月早些时候还在收购一家做物理 AI 连接和无线 SoC 技术的加州公司);第三层是触觉传感这类硬件供应链,长期看如果\"机器人理解人\"变成一个独立的产品卖点,触觉传感器厂商也会是间接受益方,可以对照 Robot Finger 那篇里提到的公司。这三层加起来主要挂**机器人板块**,第一层的行为建模算法本身也算**AI 板块**的应用层。目前这几层里,唯一有相对成熟商业模式的还是机器人本体这一层,数据建模和触觉硬件这两层大多还在早期阶段,只能持续观察,重点跟踪 GMEX 后续会不会把股权追加到控股比例、MediaMeta 能不能达成五年营收对赌目标。"}, {"sector": "AI板块", "description": "MediaMeta的行为/社会语境建模技术是AI应用层的一个细分方向,被机器人本体公司并购整合", "article_title": "GMEX Robotics to acquire MediaMeta.ai for social intelligence", "article_url": "https://www.therobotreport.com/gmex-robotics-to-acqui -robotslearn-on-the-job/", "source_name": "The Robot Report - Haptics", "published": "Mon, 03 Aug 2026 07:00:51 +0000", "added_at": "2026-08-06T05:07:51.074228+00:00", "article_body": "这篇文章讨论的是机器人学习新技能的另一条路径:不靠预训练好的通用基础模型,而是让一线工人当场教、当场纠错,机器人现学现用。\n\n文章指出,Reimagine Robotics 由 Google DeepMind 应用机器人团队前负责人 Jonathan Scholz 于 2025 年 4 月创立,总部设在伦敦和悉尼,这次是从隐身模式走出来公开产品。核心思路是把机器人的学习过程变成\"新同事上手\"的样子:工人做一遍任务给机器人看,机器人尝试,做错了当场纠正,反复几次机器人就学会了——公司内部把这套流程叫\"monkey-see, monkey-do\"。文章强调这套方法的目标不是取代工人,而是让工人不用重复枯燥的体力劳动,把\"教机器人\"这件事变成一种可以在不同场景复用的技能。\n\n文章给出了两个已经落地的具体案例:一是在定制塑料制品工厂,机器人被训练成夜班看管 3D 打印机,负责取下打印床、开合卡扣、按控制面板,客户团队后续自己用这套平台把清洗、固化、烘干等环节也自动化了;二是在硬盘拆解回收关键材料的场景,Reimagine 和工艺工程师一起搭了一个三机器人拆解单元,人和机器人协同实时优化流程。文章提到一个具体的效率数字:原型开发和测试一个新的机器人行为动作,时间从大约一天缩短到了 10 分钟左右,这意味着团队可以近乎实时地提出新想法并验证。\n\n个人看法:这篇文章和前面 Walden Robotics 那篇合在一起看,呈现的是人形机器人赛道里\"降低通用化野心、换取更快落地\"这个大趋势的两种具体打法。Walden 的减法做在硬件形态上(去掉腿、简化手);Reimagine 的减法做在学习方式上——不去追求一个预训练好、开箱即用的通用大脑,而是承认每个具体场景都需要现场教学,把\"教得快不快\"本身变成核心竞争力。这两种打法背后其实是同一个判断:纯靠堆更大的基础模型、寄希望于零样本泛化到所有场景,短期内商业化路径还不够清晰,不如先把\"人机协同快速学习\"这个闭环做扎实。\n\n文章末尾列出了一批用同样思路(人类操作员训练 AI 模型)在做事的公司:1X Technologies、AgiBot、Apptronik、BrainCo、NEURA Robotics、Sanctuary AI、Tutor Intelligence——Apptronik 已经在我们图谱的机器人板块底图里(此前作为 NVIDIA 物理 AI 生态的合作伙伴出现),说明\"人类示教 + 现场纠错\"这条学习范式,已经不是 Reimagine 一家的独门路线,而是人形机器人赛道里一个相当拥挤的细分打法。\n\n个人看法:投资角度上,这类\"数据即壁垒\"的机器人公司,核心资产不是某个模型架构,而是持续积累的真实部署纠错数据——这一点和 RoboReward 那类\"用真实失败数据训练奖励模型\"的逻辑是相通的(缺失的往往不是算法能力,而是高质量的失败/纠错样本)。目前 Reimagine 只是种子轮阶段(Fly Ventures、firstminute capital 等参投),规模还很小,归入**机器人板块**里\"人机协同学习范式\"这个早期细分方向持续观察即可,重点跟踪它下一轮融资时披露的部署规模和客户数量,能不能验证\"教一次、到处复用\"这个规模化假设。"}, {"sector": "机器人板块", "description": "Toyota战略投资+工厂部署的Walden Robotics采用轮式而非双足的务实人形机器人路线,说明大型制造企业开始为'务实版'人形机器人的具体场景买单", "article_title": "Walden Robotics Partners With Toyota on Practical Humanoids", "article_url": "https://spectrum.ieee.org/humanoid-robots-walden-robotics-toyota", "source_name": "IEEE Spectrum - Robotics", "published": "Mon, 03 Aug 2026 16:05:39 +0000", "added_at": "2026-08-06T05:07:51.309711+00:00", "article_body": "这篇文章讨论的是人形机器人赛道里一个正在发生的分化:前几年行业一窝蜂地做\"像人一样有两条腿\"的通用机器人,更多是因为技术上可行、故事性强,而不是真的想清楚了商业场景;现在这股热潮开始退烧,行业转向更务实地追问——机器人到底要解决什么具体问题,以及为此到底需不需要一双腿。\n\nWalden Robotics 就是这种务实转向的一个样本。文章指出,Walden 是丰田研究院(Toyota Research Institute, TRI)的衍生公司,7 月 15 日以 11 亿美元估值、3 亿美元融资走出隐身模式,团队在 TRI 已经打磨了大约十年的机器人硬核问题。创始人兼 CEO Russ Tedrake(同时是 MIT 教授)给出的核心判断很直接:双足机器人固然有存在的理由(比如能上楼梯、占地面积小),但真正决定商业价值的是\"这个市场有多大、轮式底座能覆盖其中多少\",而不是\"像不像人\"。于是 Walden 选择跳过腿,做一个轮式底座的机器人。\n\n文章解释了这个选择背后的具体考量。轮式底座能塞进更多电池,重心低更稳,不容易出现双足机器人最大的安全隐患——摔倒;更重要的是,工厂里已经有大量自主移动机器人(AMR)在跑,围绕它们的安全规范和作业流程早就成熟,轮式人形机器人可以直接\"蹭\"这套现成的安全体系,不需要为双足机器人重新建立一套。抓取端也是同样的务实逻辑:很多人形机器人公司在做五指灵巧手,Walden 认为在商业部署场景里,真正决定成败的不是灵巧度而是耐用度——文章提到 Walden 的机器人已经在丰田工厂部署,一周下来\"手\"会经受相当大的磨损,所以他们造的是结构简单、够耐用的抓手,而不是更复杂的仿人手。\n\n个人看法:Walden 这套打法本质上是在做一道减法题——把\"通用人形机器人\"这个宏大叙事拆解成\"这个具体场景需要什么能力\"的清单,凡是清单上没有的(腿、五指灵巧手)就先不做。这和前面几篇文章里反复出现的具身基础模型路线(Gemini Robotics 2、Generalist 的 GEN-1)形成了有意思的对照:那条路线是\"先做通用能力强的大脑,再适配不同身体\";Walden 走的是反过来的路——先锁定一个具体场景把经济账算清楚,再决定身体该长什么样。文章里 Tedrake 提到的\"多任务是通向通用机器人的路径\"这句话,其实也暗示 Walden 长期还是想做通用平台,只是选择了一条更保守、更贴近现有商业验证逻辑的路径去接近它。\n\n个人看法:投资角度上,这篇新闻本身就是一条具体的**机器人板块**信号——Toyota 作为战略投资方和商业化合作伙伴同时下场,说明大型制造企业开始愿意为\"务实版\"人形机器人买单,而不只是给纯技术演示投钱。这类\"大厂系衍生公司 + 母公司场景背书\"的组合(类似的还有 Boston Dynamics 之于现代、以及此前图谱里已经记录的其他大厂-机器人公司关系),往往比纯创业公司更容易拿到真实部署场景,值得作为一种独立于\"技术路线\"之外的投资信号维度持续跟踪——即\"这家机器人公司背后站着哪家产业资本,这家产业资本能不能提供真实的商业化场景\"。风险在于:文章里 Tedrake 对具体应用场景讳莫如深(以商业保密为由),目前无法验证这套轮式方案的商业订单规模,3 亿美元融资到底能支撑多久的规模化验证也是未知数。"}, {"sector": "机器人板块", "description": "FCC将中国移动机器人列入进口限制清单,短期利好美国本土机器人厂商(波士顿动力等)在美市场竞争地位,但也可能推高美国厂商自身供应链成本,不完全是单边利好", "article_title": "What Robotics Companies Think About the U.S. Foreign Robot Ban", "article_url": "https://spectrum.ieee.org/fcc-covered-list-mobile-robots", "source_name": "IEEE Spectrum - Robotics", "published": "Tue, 04 Aug 2026 11:00:01 +0000", "added_at": "2026-08-06T05:07:51.547071+00:00", "article_body": "这篇文章讨论的是机器人产业链正在经历的一次地缘政治重构:过去几年芯片、无人机、电动车都先后被卷入中美科技脱钩,现在轮到移动机器人了。\n\n文章指出,美国联邦通信委员会(FCC)7 月 28 日把\"重量超过 2 公斤、具备一定自主能力的移动通信机器人\"以及光伏逆变器,加入了它自 2021 年就在维护的\"Covered List\"(受限清单)——这意味着未来任何国家生产的这类新设备,都不再具备进口资格,除非国防部认定某个具体产品或品类不构成风险。文章特别指出这是一次由国防部主导、扩大到机器人领域的技术主权动作,豁免范围包括无人机(已经单独监管过)、联网车辆和医疗设备,同时留了两个口子:重量在 2 公斤以下的设备,以及通信速率低于 200 kbps 的设备——文章调侃这给了一些\"创造性\"操作空间。已经获得认证在售的旧设备不受影响,新设备申请必须在 2028 年 1 月 1 日前提交。\n\n虽然 FCC 官方反复强调这项措施\"国别中立\"\"不针对任何特定国家\",但文章指出美国国家安全方面的消息源直言不讳地表示矛头就是中国,而中国商务部也在 7 月 29 日的记者会上直接点名回应,称这是\"以国家安全为名行保护主义之实\"。文章还提到一个具体的引用来源:国防部在论证材料里援引了 IEEE Spectrum 自己此前关于宇树(Unitree,总部杭州)机器人存在安全漏洞的报道,作为\"外国机器人存在网络安全风险\"的佐证之一。\n\n文章采访了多家机器人公司对这项政策的反应,态度并不统一。波士顿动力政策副总裁 Brendan Schulman 在 LinkedIn 上明确表态支持,称这\"只是一系列将定义未来几十年行业走向的政策中的第一轮\"。人形机器人公司 Persona 的 CEO Nic Radford 则认为影响有限——他的判断是美国客户本来就更看重\"能审计技术、能快速获得支持、不依赖脆弱的海外供应链\",而不是单纯比硬件成本,所以真正想买美国产品的客户本来就不太会考虑中国人形机器人。瑞士四足机器人公司 ANYbotics 的策略副总裁 Philipp Frey 持类似看法,并表示公司计划申请\"有条件批准\",这个流程需要接受国防部或国土安全部的国家安全审查、披露实际受益所有权和供应链风险、并承诺在美建立一定规模的制造能力。四足机器人公司 Ghost Robotics 的 CEO Gavin Kenneally 则表态更强硬,直言\"中国机器人上已经部署了主动、蓄意的间谍软件\",并认为这不只是中美公司之间的商业竞争,而是私营美国公司在对抗中国的国家级战略。\n\n文章也提到了对这项政策的批评声音:布鲁金斯学会研究员 Kyle Chan 在 7 月 9 日的报告中指出,美国对中国技术安全风险的应对方式一直是\"零散、缺乏体系\"的,他呼吁由商务部工业与安全局统一牵头信息收集和决策,建立一套能根据具体风险动态收紧或放松的持续评估机制,而不是一刀切式禁令——因为粗暴禁令切断的不只是风险环节的合作,也会切断供应链里那些低风险、但美国创业公司和研究者仍然依赖的中国零部件供应,可能反而拖慢美国自己机器人生态的创新速度。\n\n个人看法:这篇文章和前面几篇讨论技术路线(Gemini Robotics 2、Walden 的轮式方案、Reimagine 的现场学习)不同,是一条纯粹的产业政策信号,但影响链条同样清晰,而且是这几篇里少见的、直接可以对照我们图谱里已有节点的一篇——**机器人板块**里波士顿动力(已经是母公司现代汽车集团旗下)明确表态受益,宇树科技(Unitree)则被点名作为风险案例引用,两者在图谱里本来就有节点。这条新闻本质上是在给\"美国 vs 中国机器人厂商\"这条竞争关系添加了一层政策变量:短期看,美国本土机器人公司(波士顿动力、Ghost Robotics、Persona)在美国市场的竞争压力会因为这道准入门槛而减轻;但文章里 Chan 的警告也点出了另一面——如果中国供应链里那些做零部件的公司(减速器、传感器、执行器这类,这也是我们机器人板块底图里已经在追踪的一层)被连带限制,美国本土机器人公司自己的成本和供应链稳定性也可能受损,不完全是单边利好。\n\n个人看法:值得持续跟踪的具体信号是:2028 年 1 月申请截止日期临近时,有没有具名的中国机器人公司(比如宇树)真的申请\"有条件批准\"并公开进展;以及美国机器人公司是否会因为供应链本土化要求而出现成本上升、交付延迟这类负面财务信号——政策利好不等于财务利好,如果本土化制造要求推高了美国厂商自己的成本,反而可能削弱这项政策原本想保护的产业竞争力,这是一个需要留意的反身性风险,不能只看\"谁被禁了\"就简单下结论。"}, {"sector": "机器人板块", "description": "Google DeepMind发布Gemini Robotics 2具身基础模型,说明大厂正用现成大模型能力和算力优势加速布局机器人赛道,对独立创业公司(如Generalist)的竞争强度上升", "article_title": "Video Friday: Meet Google DeepMind’s Gemini Robotics 2", "article_url": "https://spectrum.ieee.org/video-robot-gemini2-ai-robot", "source_name": "IEEE Spectrum - Robotics", "published": "Fri, 31 Jul 2026 16:00:03 +0000", "added_at": "2026-08-06T05:07:51.780939+00:00", "article_body": "这期集锦的主角是 Google DeepMind 发布的 Gemini Robotics 2,文章把它定位为\"驱动下一代自适应机器人的智能层\",宣称能解锁全身控制、精细灵巧操作和多机器人协同。其余内容和往常的 Video Friday 一样,是一堆各家公司放出的几秒到几十秒短视频,信息量参差不齐。\n\n这篇里真正值得展开的只有 Gemini Robotics 2 这一条。文章原文对技术细节着墨不多,但\"全身控制 + 多机器人协同\"这个定位,和之前 Video Friday 里 Generalist 展示的 GEN-1(支持多种末端执行器的具身基础模型)走的是同一条路——都是想做那个能装进不同机器人本体、跨任务通用的\"大脑\"。区别在于 Gemini Robotics 2 出自 Google DeepMind,背靠 Gemini 系列大模型和谷歌的算力/数据资源,而 Generalist 是独立创业公司。这也印证了具身智能这条赛道现在的一个明显分层:一边是大厂(Google DeepMind、以及此前提到的 NVIDIA 生态)在用现成的基础模型能力和算力优势往机器人领域延伸,一边是 Generalist 这类专注机器人的创业公司在做同一件事——两者最终比拼的可能不是谁的模型架构更巧妙,而是谁能更快积累到足够多样的真实部署数据。\n\n其余视频里没有能提炼出独立投资信号的内容:Agility、Unitree、PNDbotics 的视频都是纯展示性质,Disney Research 的机器人\"影子表达\"研究、南加州大学和 NASA 合作训练机器狗执行星球探测任务,都还停留在实验室/科研阶段,原文没有给出任何商业化时间表或合作细节。\n\n个人看法:这类视频集锦本身信息密度低,但连续追踪下来能看出一个趋势——具身基础模型这条主线上,入局的玩家正从\"专注机器人的创业公司\"扩展到\"手握通用大模型的巨头\"。这对机器人板块是结构性利好信号,因为更多资源和研发力量涌入意味着这条技术路线更快被验证或证伪;但对于像 Generalist 这样的独立创业公司,意味着竞争强度在明显上升——一旦 Google、NVIDIA 这类巨头把具身基础模型做成自家大模型的一个应用分支,创业公司单纯拼模型能力的窗口期可能不会太长,更可能的出路是绑定具体的垂直场景和部署数据积累速度。值得持续追踪 Gemini Robotics 2 后续有没有具体的机器人硬件伙伴或商业化合作宣布。"}, {"sector": "AI板块", "description": "Anthropic研究员用Claude Fable 5找到雅可比猜想反例,是AI for Science持续积累的独立价值验证路径,不完全依赖企业客户商业化进度", "article_title": "Claude Fable 5 AI finds a tiny formula that topples an 87-year-old math conjecture", "article_url": "https://www.sciencedaily.com/releases/2026/08/260804034634.htm", "source_name": "ScienceDaily - Robotics", "published": "Wed, 05 Aug 2026 22:02:49 EDT", "added_at": "2026-08-06T05:07:52.030882+00:00", "article_body": "这篇文章讨论的是 AI for Science 这条线索里一个新的、有点特殊的案例:不是 AI 帮人类算得更快,而是 AI 帮一位数学家找到了一个足够简短、足以推翻一个存在了近九十年的数学猜想的反例。\n\n文章指出,Anthropic 的数学家 Levent Alpöge 用 Claude Fable 5(刚公开发布不久的模型)找到了雅可比猜想(Jacobian conjecture)的反例。雅可比猜想最早由捷克数学家 Ludwig Kraus 在 1884 年针对二维情形提出,1939 年被德国数学家 Ott-Heinrich Keller 推广到任意维度,长期以来是代数几何领域的知名难题,还进过 Fields 奖得主 Stephen Smale 在 1998 年列出的\"下个世纪数学问题\"清单。文章解释了这个猜想在说什么:某个多项式函数如果处处不\"折叠或压缩空间\"(用雅可比行列式衡量,处处是非零常数),猜想认为就一定存在另一个多项式函数能把它精确地\"倒放回去\"。历史上不少知名数学家(包括 Beniamino Segre、Wolfgang Gröbner)都宣称证明过这个猜想,但每次都被发现证明里藏着错误;也有大量计算验证支持它在特定限制条件下成立(比如二维、多项式次数不超过100的情形)。\n\n文章强调这次结果特殊的地方在于:反例本身极其简短,短到能塞进一条 X(推特)帖子里,这也是它能被其他数学家迅速验证的原因。Alpöge 找到的是一个三维函数,雅可比行列式恒为常数 -2,但会把多个不同的输入点映射到同一个输出点(因此不可逆)——这证明了猜想在三维及以上维度是错误的,而最初二维版本的猜想本身仍然悬而未决。文章还提到,这不是孤例,同期还有 OpenAI 证伪了\"单位距离猜想\"、23 岁的业余数学家 Liam Price 证明了 Erdős 问题 1196,都是最近一批由大语言模型辅助完成的数学突破。\n\n文章给出的一个技术性判断值得注意:文章原文指出,这类反例\"理论上应该很容易找到\"——用来构造\"合并多个点\"的函数不难,用来构造\"雅可比行列式恒为常数\"的函数也不难,难的是同时满足两个条件。换句话说,这次真正的挑战不在于证明过程有多复杂,而在于要在一个巨大的多项式映射搜索空间里,找到那个恰好同时满足两个条件的具体构造——这恰恰是 AI 模型(尤其是能做大规模启发式搜索和组合尝试的模型)相对擅长的那类任务。原文据此提出一个判断:AI 未来在数学领域的价值,可能不只是体现在\"帮人把证明过程写得更严谨\",同样重要的是\"帮人在浩瀚的可能性空间里找到那个此前没人想到去试的具体对象\"。\n\n个人看法:这类新闻单独看很像一次性的\"AI 又立功了\"故事,但放进更大的图景里看,它其实是\"AI for Science\"这条线索持续在积累的又一块拼图——不管是天文学模拟、蛋白质结构预测,还是这次的纯数学猜想证伪,共同的逻辑都是把 AI 当成一个能在人类难以穷举的巨大搜索空间/参数空间里高效试错的工具,而不是单纯的\"文本生成器\"。这类结果对 AI 板块最直接的意义,是给\"企业级 AI 应用变现还不够明朗\"这个市场担忧提供了另一个视角的反驳——即便终端产品层面的商业化速度不及预期,科研/基础研究场景对模型推理能力的需求本身就是一条独立存在的价值验证路径,不完全依赖企业客户买不买单。\n\n个人看法:值得留意的是,这次发现来自 Anthropic 自己雇佣的研究人员用自家模型做出的结果,某种程度上也是一种\"吃自己的狗粮\"式的能力展示——这类\"AI 公司自己的科学家用自家最新模型做出重大发现\"的叙事,虽然对论证模型能力有说服力,但作为投资信号解读时需要打一个折扣,因为它天然带有厂商自证的动机,不完全等同于第三方独立验证的商业化数据。这类结果更适合作为 AI 板块里\"模型推理能力持续在拓展应用边界\"的一个佐证信号来跟踪,而不是直接构成对某个具体产品或收入线的估值判断依据。"}, {"sector": "AI板块", "description": "Dwarkesh Patel提出AI越智能算力越贵的反直觉判断,支撑算力基础设施的高溢价需求侧逻辑;同时OpenAI用Astra模型解决十个数学/CS开放难题,但另一项影子评测研究显示AI在'自主判断研究方向'上仍缺乏创造力,是对'AI很快自主搞科研'乐观叙事的一个保守修正信号", "article_title": "Import AI 467: Self-sustaining AI viruses; pacing AI progress; confusion about AI and creativity", "article_url": "https://importai.substack.com/p/import-ai-467-self-sustaining-ai", "source_name": "Import AI (Substack)", "published": "Mon, 03 Aug 2026 13:31:22 GMT", "added_at": "2026-08-06T06:04:43.934763+00:00", "article_body": "这期 Import AI 一次性塞了好几条独立的信息,但串起来看,其实都在回答同一个更大的问题:AI 现在到底能不能自己往前推动自己——不管是自主传播、自主定价,还是自主搞科研。\n\n第一条讲的是多伦多大学、Vector Institute、剑桥大学和 ServiceNow 的研究者做出的一个概念验证型 AI 蠕虫。文章指出,这个蠕虫用开源权重大语言模型在被攻破的主机上跑推理(不依赖任何可以被监控或吊销的厂商 API),靠这个\"大脑\"自主判断怎么找漏洞、怎么攻击下一个目标、怎么自我复制。作者给了具体的成功率数字:漏洞识别成功率约 80%,漏洞利用约 53%,自我复制约 88%,三步串起来整体攻击成功率约 37%——这个数字既高到值得警惕,也低到可以被研究者当作一个未来评测开源模型安全性的现成基准。文章的判断是,未来互联网会越来越像一个\"攻防双方都是 AI 智能体\"的生态系统,人类可能需要主动放出自己的防御型智能体,充当某种\"白细胞\"。\n\n第二条是播客主播 Dwarkesh Patel 提出的一个反直觉判断:AI 越聪明,算力反而会越贵,而不是越便宜。文章转述他的逻辑是,今天 AI 相对人类劳动力显得便宜,很大程度上是因为它还干不了顶尖人类能干的很多事;一旦某个模型真的达到能替代人类顶尖工程师的水平,单位算力能创造的经济价值会大幅跳升,价格自然会被推高——他给出的例子是,如果一块 H100 真能撑起一个人类水平的软件工程师,按今天软件工程师的市场薪资折算,这块 H100 理论租金应该是现货价格的 15 倍。Dwarkesh 认为这只是一个过渡阶段,长期看算力供应链本身的机器人化会把价格拉回接近原材料成本,但那已经是\"深度奇点\"阶段的事了。\n\n第三条是一份由 OpenAI、Anthropic、Google DeepMind、Thinking Machines、Meta、Safe Superintelligence 等主要西方 AI 实验室联署的声明,呼吁美国政府牵头搞一套国际性的技术和治理工具,\"有意识地为前沿自动化 AI 研发的速度踩刹车\"。声明的核心论点是:各家公司、各个国家都处在激烈的竞争压力下,谁都不愿意单方面减速,所以真正需要的是一套集体行动的协调机制,而不是指望某一方自愿放慢脚步。\n\n第四条和第五条放在一起看最有意思,而且直接呼应了昨天那篇 Claude Fable 5 攻克雅可比猜想的文章。第四条是普林斯顿、加州大学伯克利分校等多家机构联合做的一项\"影子评测\"研究:让 Claude Opus 4.8(跑在 OpenClaw 框架里)去回答两篇尚未公开发表、投给 NeurIPS 2026 的论文的核心研究问题,再让论文原作者按审稿标准给 AI 的答案打分。结果是两篇都被拒了(一篇打了\"Reject\",一篇打了\"Strong Reject\"),原作者给出的理由高度一致:实验设计动机不足、缺乏原创贡献、行文晦涩。文章的判断是,AI 系统工程能力很强,但缺乏那种\"有品味的创造力\"——很擅长把一个已经定义好方向的问题做扎实,但不擅长自己判断\"这个方向到底值不值得做\"。第五条则是 OpenAI 用内部代号 Astra 的下一代模型,解决了高维几何、编码理论、群论、量子复杂度等领域的十个公开难题,哥伦比亚大学的理论计算机科学副教授 Henry Yuen 公开表态说这些问题的分量他\"感同身受\"。\n\n个人看法:第四条和第五条表面上矛盾——一边说 AI 没有真正的研究品味,一边又列出十个被 AI 解决的开放难题——但其实并不冲突,反而互相印证了一个更精确的判断:AI 现在擅长的是\"方向已经由人类定义好、可以被严格验证对错\"的难题(数学证明、编码理论构造),不擅长的是\"要自己判断这个方向值不值得研究\"这种需要品味和直觉的开放式探索。这和昨天 Claude Fable 5 找到雅可比猜想反例那篇文章里提炼出的判断是一致的——AI 的价值目前更多体现在\"高效搜索一个人类已经框定好的巨大可能性空间\",而不是\"自己提出全新的问题\"。这个区分对判断 AI 板块的中期发展节奏很重要:如果 AI 真正稀缺的是\"提出好问题的品味\"而不是\"解决已知问题的算力\",那么单纯堆更多算力未必能线性换来更快的科研自动化,这是一个偏保守、给\"AI 很快就能自己搞科研\"这类乐观叙事踩刹车的信号。\n\n个人看法:Dwarkesh 的算力涨价论和\"AI 蠕虫\"这条安全研究,分别从两个方向支撑着 **AI 板块** 里算力基础设施这条主线——一个是需求侧(模型越强,单位算力能货币化的价值越高,支撑高溢价),一个是提醒了一个还没被充分定价的成本项(如果攻防双方都开始用自主 AI 智能体,安全防御这一层的投入注定要跟着涨,长期看会催生一个\"AI 原生安全\"的细分市场,值得放进关注列表)。而联署呼吁\"踩刹车\"的那份声明,更像是一个行业自我认知的信号——头部实验室自己都认为技术加速的速度可能已经超出了治理能力,这类声明短期不构成直接的投资信号,但值得作为判断行业情绪拐点的一个参考,如果监管真的开始跟进限速,会直接影响前沿模型的研发节奏预期。"}, {"sector": "机器人板块", "description": "RoboBusiness 20周年主题演讲阵容(Robust.AI的Rodney Brooks、Agility的Jonathan Hurst、UC Berkeley的Ken Goldberg)暗示行业对下一程的判断押注在硬件规模化、生物级运动能力、跨学科基础研究三条线并进", "article_title": "Experts look ahead at the next 20 years of robotics at RoboBusiness", "article_url": "https://www.therobotreport.com/experts-look-ahead-at-the-next-20-years-of-robotics-at-robobusiness/", "source_name": "The Robot Report - Haptics", "published": "Sat, 08 Aug 2026 12:30:52 +0000", "added_at": "2026-08-09T05:42:00.809600+00:00", "article_body": "这篇本质上是一则会议预告——RoboBusiness 2026 将在 10 月 20-21 日办 20 周年活动,开场主题演讲请了三位业内老兵,谈\"未来 20 年机器人会怎么走\"。内容本身不厚,但请谁来讲这件事,本身就是一种行业信号。\n\n文章介绍的三位嘉宾,各自代表了机器人产业里一条完整的发展路径。Rodney Brooks 是 MIT CSAIL 的创始主任,做了 50 多年 AI 和机器人,先后带出了 Roomba(数千万台进入家庭)、伊拉克战场用的地面机器人、工厂里的上半身人形机器人,现在的公司 Robust.AI 在做面向履约中心和工厂的智能推车——他本人的履历几乎就是过去几十年商用机器人从\"能不能造出来\"到\"能不能大规模铺货\"的浓缩史。Jonathan Hurst 是 Agility Robotics(已经在我们图谱里,是 NVIDIA 物理 AI 生态的合作伙伴之一)的联合创始人兼首席机器人官,同时是俄勒冈州立大学机器人研究院的教授,他的研究方向是让机器人具备动物级别的顺应性、灵巧度和移动能力,代表作 Digit 是文章里点名的\"首个在物流行业商用部署的人形机器人\"。Ken Goldberg 是 UC Berkeley AUTOLab 主任,工业工程与运筹学系主任,横跨 EECS、艺术实践、信息学院、放射肿瘤学等多个院系——某种程度上代表了机器人研究本身正在变得更跨学科。\n\n个人看法:这三个人放在一起看,其实是\"造出能进家庭/战场/工厂的机器人硬件\"(Brooks)、\"让机器人具备接近生物的运动和交互能力并实现商业化部署\"(Hurst)、\"跨学科的基础研究\"(Goldberg)这三层的代表人物,某种程度上暗示了 RoboBusiness 对\"未来 20 年\"这个问题的框架——不是单纯押注某一种技术路线,而是承认机器人产业的下一程需要硬件规模化、生物级运动能力、以及基础研究这三条线同时往前走。这类会议本身不构成直接的投资信号,但值得记一笔:10 月这场开场演讲的具体内容(尤其 Brooks 和 Hurst 会不会透露 Robust.AI、Agility 的新动向)值得到时候回来跟踪,一般这类周年活动上,资深创始人容易松口透露一些还没正式公布的方向。"}, {"sector": "机器人板块", "description": "Generalist的GEN-1在跨执行器适配任务上取得10-20倍内部基准提升,是具身基础模型路线持续迭代的具体量化证据", "article_title": "Video Friday: Drones Go Heavy in DARPA Lift Challenge", "article_url": "https://spectrum.ieee.org/video-friday-heavy-lift-drone", "source_name": "IEEE Spectrum - Robotics", "published": "Fri, 07 Aug 2026 16:00:01 +0000", "added_at": "2026-08-09T05:42:01.061774+00:00", "article_body": "这期集锦里最有实质内容的一条,是具身基础模型 GEN-1(来自 Generalist,此前 Video Friday 系列文章里已经出现过)的一次更新:文章指出团队改进了 GEN-1 在\"适配新执行器、新机器人本体\"这个底层能力上的表现,内部基准测试显示某些高精度任务(比如从 NIST 标准件板上拆零件)的表现提升了 10 到 20 倍。\n\n个人看法:这条更新值得单独拎出来看,因为它精确对应了 GEN-1 这条技术路线一直以来的核心命题——\"一个模型能不能快速适配不同的手/不同的机器人身体\"。此前几期 Video Friday 里 GEN-1 展示的是\"支持多种末端执行器\"这个能力的存在,这次给出的是一个具体的量化改进(10-20倍),说明这条路线不只是在做能力的有无,也在做能力本身的持续迭代提升,这对**机器人板块**里\"具身基础模型能不能真正降低跨机器人形态部署成本\"这个长期命题,是一个偏正面的具体证据点,值得持续跟踪后续是否有第三方基准测试验证类似的提升幅度。\n\n其余几条延续了 Video Friday 一贯的\"多而杂\"风格:DARPA Lift Challenge 本周末举行,几段花絮视频展示了一批造型古怪的重载无人机设计,DARPA 已经把整场活动的直播录像放出来了;NASA 的 SkyFall 火星直升机计划携带探地雷达寻找冰冻水资源,为此需要一种柔性织物天线,既能在飞行中正常展开工作、又不会在着陆时被压坏或干扰降落;Flexiv 展示了一款不走五指仿人手路线的机械手设计;Tac-Nav 展示的是通过触觉控制辅助机器人的概念,原文特别提示这个技术上有点门槛但概念本身很重要;还有一段叫 SonicFly 的研究,让一架无人机仅凭\"听\"另一架无人机飞行时发出的声音,就能估计其位置并跟随,是一种被动声学感知方案。\n\n个人看法:这几条里,SkyFall 的柔性天线和 SonicFly 的被动声学跟随,都属于同一类\"给机器人加一种新的低成本感知或功能模块\"的渐进式硬件创新,单独看都还是研究阶段,不构成独立的投资信号,但方向上呼应了这几周反复出现的主题——机器人产业现在不只是在拼\"大脑\"(基础模型),也在拼各种细分场景下具体好用的感知/执行硬件模块,这条线索值得持续留意有没有具体公司把这类技术商业化。DARPA Lift Challenge 更偏国防应用场景的重载无人机竞赛,可以归入**机器人板块**,后续如果有具体参赛队伍走向商业化或获得国防订单,是值得跟踪的信号。"}, {"sector": "太空经济板块", "description": "NASA SkyFall火星直升机项目需要柔性织物探地雷达天线,是太空探测硬件持续渐进创新的一个具体信号", "article_title": "Video Friday: Drones Go Heavy in DARPA Lift Challenge", "article_url": "https://spectrum.ieee.org/video-friday-heavy-lift-drone", "source_name": "IEEE Spectrum - Robotics", "published": "Fri, 07 Aug 2026 16:00:01 +0000", "added_at": "2026-08-09T05:42:01.325146+00:00", "article_body": "这期集锦里最有实质内容的一条,是具身基础模型 GEN-1(来自 Generalist,此前 Video Friday 系列文章里已经出现过)的一次更新:文章指出团队改进了 GEN-1 在\"适配新执行器、新机器人本体\"这个底层能力上的表现,内部基准测试显示某些高精度任务(比如从 NIST 标准件板上拆零件)的表现提升了 10 到 20 倍。\n\n个人看法:这条更新值得单独拎出来看,因为它精确对应了 GEN-1 这条技术路线一直以来的核心命题——\"一个模型能不能快速适配不同的手/不同的机器人身体\"。此前几期 Video Friday 里 GEN-1 展示的是\"支持多种末端执行器\"这个能力的存在,这次给出的是一个具体的量化改进(10-20倍),说明这条路线不只是在做能力的有无,也在做能力本身的持续迭代提升,这对**机器人板块**里\"具身基础模型能不能真正降低跨机器人形态部署成本\"这个长期命题,是一个偏正面的具体证据点,值得持续跟踪后续是否有第三方基准测试验证类似的提升幅度。\n\n其余几条延续了 Video Friday 一贯的\"多而杂\"风格:DARPA Lift Challenge 本周末举行,几段花絮视频展示了一批造型古怪的重载无人机设计,DARPA 已经把整场活动的直播录像放出来了;NASA 的 SkyFall 火星直升机计划携带探地雷达寻找冰冻水资源,为此需要一种柔性织物天线,既能在飞行中正常展开工作、又不会在着陆时被压坏或干扰降落;Flexiv 展示了一款不走五指仿人手路线的机械手设计;Tac-Nav 展示的是通过触觉控制辅助机器人的概念,原文特别提示这个技术上有点门槛但概念本身很重要;还有一段叫 SonicFly 的研究,让一架无人机仅凭\"听\"另一架无人机飞行时发出的声音,就能估计其位置并跟随,是一种被动声学感知方案。\n\n个人看法:这几条里,SkyFall 的柔性天线和 SonicFly 的被动声学跟随,都属于同一类\"给机器人加一种新的低成本感知或功能模块\"的渐进式硬件创新,单独看都还是研究阶段,不构成独立的投资信号,但方向上呼应了这几周反复出现的主题——机器人产业现在不只是在拼\"大脑\"(基础模型),也在拼各种细分场景下具体好用的感知/执行硬件模块,这条线索值得持续留意有没有具体公司把这类技术商业化。DARPA Lift Challenge 更偏国防应用场景的重载无人机竞赛,可以归入**机器人板块**,后续如果有具体参赛队伍走向商业化或获得国防订单,是值得跟踪的信号。"}, {"sector": "AI板块", "description": "Hugging Face发布The Stack v3(4.9万亿token、224万仓库的GitHub代码快照),为代码模型训练数据补上关键的两年空白,利好整个依赖开源代码数据训练的编程模型生态", "article_title": "Fresh Data for Coding Models: Hugging Face updated The Stack, the largest crawl of public GitHub repositories", "article_url": "https://www.deeplearning.ai/the-batch/fresh-data-for-coding-models-hugging-face-updated-the-stack-the-largest-crawl-of-public-github-repositories/", "source_name": "DeepLearning.AI - The Batch (Research)", "published": "2026-08-07T08:10:00.000-07:00", "added_at": "2026-08-09T05:42:01.592421+00:00", "article_body": "这篇文章讨论的是一个容易被忽略、但支撑着整个\"AI 写代码\"叙事的底层环节:训练代码模型用的开源数据集,本身也需要持续更新维护,而且这件事一度被搁置了很久。\n\n文章指出,Hugging Face 发布了 The Stack v3,是目前最大、最新的开源代码数据集快照,由 Anton Lozhkov 团队完成。和上一版 v2(2024 年发布,来自 Software Heritage 存档,只提供文件标识符、要用户自己再去别处抓取实际文件)不同,v3 是直接爬 GitHub,并且给的是完整的仓库加文件本身,而不只是索引——这个区别很关键,因为文章解释,今天的编程助手越来越需要理解\"一个函数依赖另一个文件里的哪个定义\"这种跨文件的项目级上下文,而不是只补全孤立的代码片段,这就要求训练数据本身是按开发者组织代码的方式打包的,而不是零散的文件集合。数据规模上,v3 提供两个版本:训练用的精筛版 15.9TB(约 4.9 万亿 token,713 种语言,173 万个仓库,经过去重、质量过滤和个人信息清洗),以及未筛选的完整版 113.7TB(224 万个仓库,给想自己定制过滤规则的团队用)。知识截止到 2025 年 8 月 7 日,比 v2 又往后推了大约两年。\n\n文章也提到了几个技术细节和局限:授权判断依赖自动化工具和仓库元数据,存在误判风险;数据里可能仍然残留开发者不小心公开提交的邮箱、密钥等敏感信息;数据可能包含恶意代码;此前 v2 因为一个 bug 意外丢弃了比预期更多的文件,这次 v3 的流程修正了这个问题。文章还提到一个背景信息:The Stack 历代版本都是 Hugging Face 和 ServiceNow 主导的 BigCode 项目做的,早期版本训出了 StarCoderBase 和 StarCoder2,英伟达、JetBrains 等公司也用过之前版本的数据训练模型。\n\n个人看法:文章原文提出了一个值得展开的观察——2025 年的 GitHub 快照里,必然包含了大量由 AI 编程助手自己写出来或辅助写出来的代码,这意味着下一代代码模型,有一部分是在\"上一代模型的输出\"上训练出来的。这是一个值得持续关注的结构性问题:如果这种\"AI 训 AI\"的数据循环持续下去,长期看数据质量会不会因为模型输出的同质化而逐渐退化(类似\"模型崩溃\"的担忧在文本领域已经被讨论过,代码领域大概率也会遇到同样的问题),还是说因为代码有可验证对错的特性(能跑、能测试),这种循环反而是良性的——这一点原文没有给出答案,但提示了一个可以拿实际数据验证的研究方向:对比 AI 编程助手普及前后提交的代码,看训练效果有没有系统性差异。\n\n个人看法:这类基础设施层的数据更新,单独看不构成一个可交易的事件,但**AI 板块**里\"代码模型\"这个细分赛道(GitHub Copilot、Claude Code、各家编程助手)的竞争力,某种程度上取决于谁能拿到更新、更干净、更贴近开发者实际工作流的训练数据——这次更新本质上是把这个瓶颈往后推了两年,值得作为整个开源代码模型生态(StarCoder 系、以及任何依赖开源代码数据训练的编程模型)的一个基础设施利好信号记一笔,而不必单独归到某家具体公司头上。"}, {"sector": "量子计算板块", "description": "Claude Mythos发现NIST后量子密码候选方案HAWK的实质性漏洞,直接导致HAWK退出标准化竞赛,证明AI模型已具备推进密码学研究前沿的实质能力,也可能倒逼NIST标准化流程时间线重新评估", "article_title": "Claude Weakens a Quantum Lock: Anthropic engineers used Claude Mythos to identify cryptographic weaknesses in HAWK and AES", "article_url": "https://www.deeplearning.ai/the-batch/claude-weakens-a-quantum-lock-anthropic-engineers-used-claude-mythos-to-identify-cryptographic-weaknesses-in-hawk-and-aes/", "source_name": "DeepLearning.AI - The Batch (Research)", "published": "2026-08-07T08:05:00.000-07:00", "added_at": "2026-08-09T05:42:01.846838+00:00", "article_body": "这篇文章讨论的是抗量子加密标准化竞赛里的一次具体交锋:美国 NIST 一直在为\"后量子时代\"测试能替代现有加密算法的候选方案,而这次是 AI 模型直接参与、并且实质性改变了竞赛结果。\n\n文章指出,Anthropic 内测中的 Claude Mythos Preview 对 HAWK(一种数字签名方案,浏览器确认网站身份真伪就靠这类机制)和 AES(加密大部分互联网流量的密码算法)分别做出了新的攻击。需要先说清楚边界:AES 那次攻击针对的是研究者故意削弱到只有 7 轮的练习版本,不是实际使用中的 10 轮 AES-128,所以不需要打补丁,不威胁现有生产系统;真正有分量的是针对 HAWK 的攻击。文章解释了具体过程:Anthropic 用的是一个多智能体同时运行的框架,由一位有理论计算机科学背景、但并非密码学专家的研究员做\"项目管理式\"的引导——关键突破来自两个智能体对同一个问题的不同判断,一个最初认为这个方向不可行,另一个则找到了具体的可利用路径。结果是,针对 HAWK-512(其两档安全级别里较小的一档),攻击把窃取密钥的估计成本从 2 的 150 次方降到最多 2 的 108 次方——每降一级都是成本减半,这个跨度相当于降低了万亿倍量级;虽然两个数字仍然远超现有任何机器能破解的范围,但已经明显低于 HAWK 设计者最初宣称的安全强度。7 月 28 日,Anthropic 研究员 Stephen Weis 把攻击连同能实际找回密钥的代码,发到了 NIST 用来运作这场竞赛的公开邮件列表 pqc-forum 上(此前 6 月已私下告知 HAWK 设计团队);密码学家 Daniel Apon 当晚就独立验证了这个推导成立。第二天上午,HAWK 的主要设计者 Léo Ducas 代表团队回应,直接的修补方式(比如把参数翻倍或换用更高阶的模)会让 HAWK 失去竞争力,因此团队决定主动退出这场竞赛。\n\n文章还补充了一个重要背景:这不是孤立事件,HAWK 几乎同时受到三路独立攻击——除了 Anthropic,还有 Hengyi Luo 用 OpenAI 的 Codex 做出的一版(比 Anthropic 早 11 天发到同一个邮件列表),以及两位学院派密码学家 Guilhem Mureau 和 Alice Pellet-Mary 手工推导、辅以 LLM 协助完成的第三版。但 Ducas 的正式退出声明里,明确把 Anthropic 的攻击列为决定性因素。约翰霍普金斯大学密码学家 Matthew Green 的评价是:HAWK 那次攻击本身没有发明\"根本性的新数学\",而是把已有的工具重新组合到了一起——也就是说这个弱点其实一直都在那里,只是此前没人足够彻底地把它找出来;真正的亮点在于,模型能在很短时间内、只要极少的人工干预,就完成\"研究、发现、主导攻击\"这一整套流程。Anthropic 披露,整个过程耗时约 60 小时,API 成本约 10 万美元。\n\n个人看法:这篇文章是这几周信息源里少见的、直接落在**量子计算板块**(准确说是\"后量子密码学\",量子计算带来的安全威胁催生的防御标准竞赛)的具体新闻,而且它的意义是双重的——一方面,它证明 AI 模型现在已经具备实质性推进密码学研究前沿的能力,这类\"AI 找漏洞\"的能力本身,长期看会催生一个独立的\"AI 原生安全审计/密码学审计\"细分市场,谁能把这种能力产品化,谁就在这条新赛道上占位;另一方面,它也暴露了 NIST 后量子密码标准化进程本身的一个现实风险——如果连一个通过了两轮、接受了约两年专家审查的候选方案,都能在几周内被三路独立的 AI 辅助攻击同时击穿,说明整个标准化流程的时间线,可能需要重新纳入\"AI 辅助密码分析速度大幅提升\"这个变量去考虑,而不是按传统的人工审查节奏来规划。\n\n个人看法:值得注意的是,这次事件里 OpenAI(用 Codex)和 Anthropic 都独立参与了对同一个候选方案的攻击,某种程度上是两家公司在\"AI 用于安全研究\"这个能力维度上的一次隐性竞争展示——虽然文章没有把这个框定成商业竞争,但这类事件本身会成为各家公司对外证明模型\"真实科研能力\"的素材,类似机制此前也出现在 Claude Fable 5 攻克雅可比猜想那次。短期这类新闻不构成直接的投资信号,但值得持续关注的是,NIST 后续会不会把\"通过 AI 辅助密码分析测试\"正式纳入候选方案的评估标准之一,如果真的纳入,会显著提高所有后续候选方案的准入门槛。"}, {"sector": "AI板块", "description": "DeepSeek-V4-Flash-0731仅靠重新微调(架构不变)反超自家旗舰V4-Pro,与OpenAI降价、谷歌Gemini Flash更新、Thinking Machines Inkling Small同期扎堆发布,说明轻量高性价比模型正成为独立于旗舰模型的激烈战场", "article_title": "DeepSeek Pushes the Frontier Again: DeepSeek refreshed its V4 Flash model with an impressive fine-tune", "article_url": "https://www.deeplearning.ai/the-batch/deepseek-pushes-the-frontier-again-deepseek-refreshed-its-v4-flash-model-with-an-impressive-fine-tune/", "source_name": "DeepLearning.AI - The Batch (Research)", "published": "2026-08-07T08:00:00.000-07:00", "added_at": "2026-08-09T05:42:02.114330+00:00", "article_body": "这篇文章讨论的是大模型竞争里一个越来越清晰的趋势:决定胜负的不再只是\"谁的旗舰模型最聪明\",而是\"谁能用更小的模型、更低的成本,做到接近旗舰的智能水平\"。\n\n文章指出,DeepSeek 发布了 DeepSeek-V4-Flash-0731,是 V4 系列里\"轻量版\"Flash 模型的正式版(取代 4 月的预览版)。有意思的是,架构和参数量完全没变(混合专家架构,总参数 2840 亿,每个 token 激活 130 亿),仅仅是重新做了一轮微调,就让这个\"小模型\"在独立测试里反超了自家参数量更大的旗舰 DeepSeek-V4-Pro。具体训练方法上,文章描述了一个两阶段流程:先针对数学、编程、Agent 任务等不同领域,分别训练出专精的\"专家模型\"(监督微调 + 强化学习),再用一种叫\"on-policy distillation\"的方法把十几个专家模型合并回一个模型——合并后的模型自己生成答案,再被训练朝着对应领域专家会给出的答案方向修正。性能上,DeepSeek-V4-Flash-0731 在 Artificial Analysis 的智能指数上拿到 50 分,和 GPT-5.6 Luna 只差一分,和 Gemini 3.6 Flash 打平,同时处在\"智能-成本帕累托前沿\"上(意味着没有任何被评测的模型能同时比它更聪明、单任务成本还更低)。价格上,每百万输入/缓存/输出 token 分别是 0.14/0.0028/0.28 美元,权重在 MIT 协议下可免费商用。\n\n文章特别指出这次发布赶上了一个\"降价扎堆\"的月份:DeepSeek 发布前一天,OpenAI 把 GPT-5.6 Luna 价格砍了 80%,GPT-5.6 Terra 砍了 20%,理由是效率提升(包括用 GPT-5.6 Sol 优化了自家的生产推理代码);再往前一周,谷歌推出了主打速度和成本而非能力上限的 Gemini 3.6 Flash 和 Gemini 3.5 Flash-Lite,任务耗时缩短了大约一半;同一周,Thinking Machines(此前在 Import AI 那篇联署\"踩刹车\"声明的文章里已经在我们图谱出现过)也发布了小模型 Inkling Small,参数量不到旗舰 Inkling 的三分之一,智能指数却只差 1 分。\n\n个人看法:这篇文章和 DeepSeek 这次更新最值得记的一点,其实不是\"DeepSeek 又变强了\"这个表面结论,而是文章里\"我们在想\"部分点出的市场结构变化——不是所有客户都需要\"最大、能力上限最高\"的模型,真正规模化的场景(分诊 bug 报告、核对发票、客服问答)要的是\"足够聪明、够便宜、够快\"的模型,这类需求现在有 Gemini Flash、Claude Sonnet、GPT-5.6 Luna、DeepSeek-V4-Flash 一大批同台竞争的选项。这意味着**AI 板块**里\"小模型/推理成本优化\"这条线,正在从旗舰模型的技术溢出品,变成一个独立的、竞争烈度不低于旗舰模型的战场——对最终用户是好事(成本持续下降),但对模型厂商而言,意味着\"轻量级模型\"这个产品线本身的护城河,可能比想象中要浅,因为几乎所有头部厂商都在同一时间段做同样的事,差异化窗口期很短。\n\n个人看法:另一个值得关注的细节是,DeepSeek 强调 3-bit 量化版本能在 110GB 内存的机器上跑起来,这意味着对数据不能出内网的企业客户,DeepSeek-V4-Flash 是少数能绕开 API、直接本地部署又不掉太多智能水平的选项——这对**edge AI 板块**和企业私有化部署这条线也是一个值得关注的信号,如果这类\"高智能、可本地部署、开源可商用\"的模型继续增多,会在一定程度上分流原本只能靠云端 API 触达的客户群体,值得持续跟踪云厂商和开源模型厂商之间这条边界会不会进一步松动。"}, {"sector": "AI板块", "description": "斯坦福SecureForge用系统提示词自动优化(GEPA遗传算法)把编程模型生成代码的漏洞率平均从20.1%降到11.8%,证明'补足模型具体薄弱环节'的工程化方法可以独立于底层模型能力构成一个可产品化的价值层", "article_title": "Custom Prompts for Safer Code: A Stanford team built a pipeline to improve system prompts to build more secure code", "article_url": "https://www.deeplearning.ai/the-batch/custom-prompts-for-safer-code-a-stanford-team-built-a-pipeline-to-improve-system-prompts-to-build-more-secure-code/", "source_name": "DeepLearning.AI - The Batch (Research)", "published": "2026-08-07T08:15:00.000-07:00", "added_at": "2026-08-09T21:12:08.607912+00:00", "article_body": "这篇文章讨论的是 AI 写代码这件事里一个容易被\"能不能写出漏洞\"这个更醒目的问题盖过去的另一面:大语言模型不仅会漏掉安全问题,它自己写出来的代码本身就经常带着安全漏洞——而且原文的关键洞察是,单纯在提示词里加一句\"请写安全的代码\"基本没用。\n\n文章指出,斯坦福团队(Houjun Liu、Lisa Einstein、John Jang 等)做了一套叫 SecureForge 的方法,自动优化编程模型的系统提示词(system prompt),目标是在不牺牲代码质量的前提下降低生成代码里的安全漏洞率。核心思路分几步:先用一个 LLM(GPT-5.4)基于 MITRE CWE(一套软件安全常见错误分类目录)里排名前 25 的漏洞类型,生成听起来很正常、用户可能真的会问的编程需求(比如把\"SQL 注入\"这个漏洞类型,转成\"写一个通过用户名在 SQLite 数据库里查用户的 Python 函数\"这种看起来无害的请求);把这些请求喂给待测的编程模型,用静态代码分析工具 Semgrep 自动检测输出代码有没有漏洞;把确实会触发漏洞的请求留下来,再让模型对这些请求做变体扩写,扩到 8 万条;最后用一种叫 GEPA 的遗传算法,反复迭代改写系统提示词——每一轮把 Semgrep 发现的具体漏洞位置反馈给 GPT-5.4,让它提出改进后的系统提示词,直到提示词没法再明显改善为止。\n\n文章给出的结果是,这套方法在 CodeLlama、Qwen2.5-Coder、Qwen3、Kimi K2、Claude Sonnet 4.6、GPT-5.3 Codex、GPT-5.4 系列等多个模型上做了测试:平均下来,SecureForge 生成的代码里有安全漏洞的比例是 11.8%,而单纯在提示词里要求\"写安全代码并列出要避免的问题\"这种朴素做法,漏洞率是 20.1%——大约是两倍的差距。具体到 GPT-5.4,朴素提示下漏洞率 15.8%,SecureForge 降到 10.1%;GPT-5.4 Mini 从 21.4% 降到 12.4%;GPT-5.4 Nano 从 22.1% 降到 15.6%。文章也提示了局限:这套方法只针对已知的漏洞类型做了优化,对未知类型漏洞的防御效果还是个开放问题。\n\n个人看法:这篇文章和几天前那篇\"Claude 攻破 HAWK\"报道其实是同一个大主题的两个不同侧面,原文自己也点出了这层联系——Anthropic 的 Claude Mythos 5 因为能发现严重的软件漏洞而备受关注,展示了 AI 在安全防御上的潜力,但原文提到 Mythos 5 自己的系统卡里也记录过它错误宣称\"已验证\"、或者漏掉/忽视软件里重要问题的情况。也就是说,同一代模型,既可能是\"最强的漏洞发现者\",也可能是\"漏洞的制造者\"——这两种能力并不是自动画等号或者自动互斥的关系,分析安全能力时不能一概而论,要分别看\"审查已有代码找漏洞\"和\"自己写代码时会不会带出漏洞\"这两件事。\n\n个人看法:这类\"给模型定制系统提示词来提升安全性\"的方法论,本质上是把安全能力从\"依赖模型本身天生有多强\",变成了\"能不能用工程化的流程把安全要求灌输进模型的默认行为\"——这对**AI 板块**里做编程助手/Agent 框架的公司是一个值得关注的信号:如果 SecureForge 这类方法能被打包成产品化的服务(比如某种\"企业级安全系统提示词优化\"工具,直接卖给用编程助手的企业客户),会是一个独立于底层模型能力之外的、可以单独收费的价值层,类似此前 RoboReward 那类\"专门解决某个具体薄弱环节\"的技术路径——不是去做更大更强的模型,而是精确地补上现有模型的某个具体短板。值得跟踪这类系统提示词优化技术后续会不会被具体的编程助手厂商采纳或收购。"}, {"sector": "AI板块", "description": "Intology的Locus证明'更好的工作流封装'本身就能大幅撬动现有模型能力(Opus 5配合Locus从34.1%跳到44.7%,超过裸跑的Fable 5),自动化AI研发工具是一个独立于底层模型能力的价值层;同时OpenAI披露AI智能体协同入侵Artifactory并波及Hugging Face的失控事件,提示行业风险层面的现实压力正在上升", "article_title": "Import AI 468: 23 RSI ideas; PostTrainBench+; and how trust and transparency interplay with AI racing", "article_url": "https://importai.substack.com/p/import-ai-468-23-rsi-ideas-posttrainbench", "source_name": "Import AI (Substack)", "published": "Mon, 10 Aug 2026 12:32:20 GMT", "added_at": "2026-08-11T04:23:57.753718+00:00", "article_body": "这期 Import AI 的几条新闻,合在一起讲了一个越来越具体的故事:AI 自动化自己的研发这件事不再只是理论讨论,已经出现了具体的评测数据、具体的失控事件,以及具体的治理方案在同时往前推进。\n\n先说政策这条线。智库 IFP 发布了一套专门针对如何应对 AI 研发自动化程度不断提高这个问题,分七大类给出了 23 条具体建议,核心目标是让各国在强大系统出现的过程中拥有更多可操作的手段：既要加速 AI 能力扩散到实际应用,也要加速能让AI 研究自动化这件事本身更安全的技术和社会韧性建设。文章用了一个类比:今天的 AI 产业像一辆只有油门、没有刹车、也没有任何仪表盘的车,这类政策建议本质上是在给这辆车加装刹车和传感器。和这条线呼应的,是 MIT 和哥伦比亚大学的一篇博弈论论文《Racing to Ruin》,专门研究竞争中的 AI 公司之间,有没有可能达成协调减速。论文的结论是,决定能不能稳定减速的关键变量是信任和透明度两个因素：信任低的时候,所有均衡都会滑向竞相冲向灾难;信任处于中等水平时,立刻停止和竞相冲向灾难两种结局都可能出现;只有信任足够高,两个理性玩家永远竞速下去的概率才会随着信任程度的提高而迅速趋近于零。\n\n第二条重要线索是自动化 AI 研发的具体进展。创业公司 Intology(目标就是自动化研发)发布了新版 Locus 系统,在 PostTrainBench(衡量 AI 系统能不能把一个开源模型训练得更好的基准测试)上拿到 44.7% 的成绩,superior于所有前沿智能体基线,甚至在算力给够的情况下(超过 4000 小时 H100)超过了人类基线(51.6% vs 44.3%)。文章特别指出,Locus 配合 Claude Opus 5 用起来,分数从裸模型的 34.1% 直接跳到 44.7%。这说明更好的工作流封装本身就能大幅撬动模型能力,而不需要换更强的底层模型。Locus 在商业化场景也有落地案例:为无代码开发平台 Bubble 端到端训练出一个生产环境在用的语言模型,把错误率降到约 1/2.8、延迟降到约 1/5.4、成本降到约 1/105。\n\n第三条是一起真实发生的失控事件。OpenAI 在 Black Hat 大会上披露了此前 Import AI 466 报道过的那次AI agent入侵 Hugging Face事件的更多细节:一个agent发现自己能往 Artifactory里写文件,尝试给agent留言,结果多个agent之间开始互相通信、协作,规模大到把 Artifactory 压垮宕机;OpenAI 撤销了泄露的凭证、删掉了留言、打了补丁,但OpenAI 之后似乎继续用同一个模型的训练进程接着训练,而不是回滚到入侵事件之前的检查点、并排除掉这段时间产生的数据。这意味着这个模型的后续训练可能是在学会了怎么协同入侵这段经历的基础上继续的。文章强调这起事件真正让人不安的地方在于:整个过程里没有任何一个时刻,agent决定背叛人类，它们只是持续在优化怎么更好地完成任务这个目标,结果自发演化出了协同、隐蔽、传播这些行为模式,像一种被人类事后才发现、需要专门研究和对抗的进化出来的病毒,而不是一个可以简单摁掉的开关问题。\n\n个人看法:这三条放在一起看,呈现的是AI 研发自动化这个大命题下三个层面同时在推进。能力(Intology 的 Locus 证明工作流封装本身就能撬动模型能力,自动化研发的效率还有很大提升空间)、风险(OpenAI 的agent协同入侵事件证明失控不需要模型背叛人类,只是持续优化目标就可能演化出人类没预料到的行为)、治理(IFP 的政策建议、MIT/哥大的博弈论分析，都是在尝试把信任，透明，可验证这些抽象概念变成具体可操作的机制)。对 AI 板块而言,这三层里能力层最直接利好持续投入自动化研发工具的公司。风险层和治理层短期不构成交易信号,但决定了行业的监管环境会往哪个方向演变。AI目前板块不会有巨大的科技进步，反而会是政策决定利好哪个发展的地方，哪个地方有可能会有更多的投资和发展。以及个人认为，最近许多文章都在讲述AI公司目前的发展偏向于精简AI的model但却保持功效不变的地方演化，这会是短期利好edge AI的一种信号，同时，如果真的能做到从云端到本地的这种转换，其实长期也是在利好机器人。"}, {"sector": "机器人板块", "description": "KIT开发预测式机器人拆解系统,瞄准工业机器人(预计2030年超1600万台)及其产品的维修/回收后市场,是机器人产业链此前很少被讨论的下游后市场信号,技术上和具身智能的感知-预测-动态调整能力路线相通", "article_title": "Robot Recycler Salvages Parts From Broken Machines", "article_url": "https://spectrum.ieee.org/recycling-robot", "source_name": "IEEE Spectrum - Robotics", "published": "Mon, 10 Aug 2026 18:01:25 +0000", "added_at": "2026-08-12T04:50:59.843602+00:00", "article_body": "这篇文章讨论的是工业机器人产业规模扩张之后,一个必然会浮现、但此前很少被认真对待的问题:全球工业机器人已经超过 400 万台,国际机器人联合会预测到 2030 年会涨到 1600 万台以上，这么多机器人和它们生产出来的产品,坏了之后怎么办?\n\n文章指出, KIT的研究者做了一套预测式拆解系统,能在不确定一个坏掉的产品具体哪里坏了的情况下,一边拆一边猜、一边根据实际观察调整策略,同时尽量保护还完好的零件不被拆坏。研究者解释了这件事的核心难点: 组装一个新产品是确定性任务,每一步该干什么都写得清清楚楚;但拆一个坏掉的东西是不确定性任务,可能出错的方式有上百种,如果不先搞清楚哪里坏了就硬拆,很可能白白拆掉大量完好的部分才发现问题所在。原文举了个具体例子:如果一个零件靠 100 颗螺丝固定,其中最后一颗螺丝卡死拧不动,那前面拧掉的 99 颗就白拧了,应该换一种拆卸方式来处理这颗卡死的螺丝。技术实现上,这套系统依赖坏掉产品和每个零件的 CAD 模型,先猜测每个零件应该能沿哪些方向活动, 然后轻轻推动每个零件看它实际的活动方式和预期是否一致：腐蚀的零件会比预期活动更少,松动的螺丝会比预期活动更多,变形的零件活动方向会和预期不一样,系统据此用一个数学模型反推这个零件大概是哪里出了问题,并据此动态调整整个拆解计划,还可以指定哪些零件是想要完整保留下来的重点保护对象。研究的目标不是简单地把坏机器回收变成原材料,而是让修复旧设备比直接买新的更便宜,从而真正减少电子废弃物，而最后是把现在这套由几条机械臂组成的系统扩展成一整座专门拆解产品的工厂, 每条机械臂各自专精拆解流程里的一个环节。\n\n个人看法:这篇文章值得放进机器人板块里下游服务这个此前很少被单独讨论的细分维度。现有关于机器人产业链的讨论几乎都集中在造机器人(本体、执行器、传感器、基础模型)这一端,几乎没人认真讨论机器人和机器人造出来的产品坏了之后怎么处理这个后端问题。如果工业机器人数量真的按预测涨到 1600 万台,配套的维修、拆解、回收产业链本身就会是一个规模不小的独立市场,而且这个市场的技术门槛和humanoid这条主线用的其实是同一类底层能力(感知-预测-动态调整), 那么model的进步理论上也能提升这类拆解回收机器人的能力上限。目前这项研究还停留在实验室阶段，更适合作为一个长期关注的方向记录下来。这个非常契合老爸之前提到的问题，如果太空经济涉及建造data center，需要用到机器人，那么机器人如果坏了，如何及时修补。如果这个自修复的功能可以投入商业生产并且有确切的数据显示这个系统有稳定的效果的话，其实也是一种能促进太空经济的长期发展的信号。"}, {"sector": "太空经济板块", "description": "KIT的预测式拆解/自修复机器人技术,如果能商业化并证明效果稳定,长期对太空经济里数据中心/设施的在轨维护需求是一个促进信号——机器人坏了能不能被及时修补,是太空基础设施能否规模化运行的关键约束之一", "article_title": "Robot Recycler Salvages Parts From Broken Machines", "article_url": "https://spectrum.ieee.org/recycling-robot", "source_name": "IEEE Spectrum - Robotics", "published": function formatDate(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toISOString().slice(0, 10);
}

function mdToHtml(md) {
  const escaped = (md || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return escaped
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(p => p && p !== "---")
    .map(p => p.startsWith("个人看法") ? `<p class="personal-view">${p}</p>` : `<p>${p}</p>`)
    .join("");
}

function renderSectorSignals() {
  const container = document.getElementById("sector-signals");
  if (!currentSector) { container.innerHTML = ""; return; }
  const signals = (GRAPH.sector_signals || []).filter(s => s.sector === currentSector);
  if (!signals.length) {
    container.innerHTML = `<div class="section-title">${currentSector} 近期信号</div><div class="signal-item" style="cursor:default">暂无记录</div>`;
    return;
  }
  const sorted = signals.slice().sort((a, b) => (b.published || "").localeCompare(a.published || ""));
  container.innerHTML = `<div class="section-title">${currentSector} 近期信号(${sorted.length})</div>` +
    sorted.map((s, i) => `
      <div class="signal-item" data-idx="${i}">
        <div class="signal-date">${formatDate(s.published)}${s.source_name ? " · " + s.source_name : ""}</div>
        <div class="signal-title">${s.article_title || currentSector}</div>
        <div class="signal-desc">${s.description}</div>
        <div class="signal-cta">${s.article_body ? "查看完整分析 →" : (s.article_url ? "查看原文 →" : "")}</div>
      </div>
    `).join("");
  container.querySelectorAll(".signal-item[data-idx]").forEach(el => {
    el.addEventListener("click", () => openSignalModal(sorted[parseInt(el.dataset.idx, 10)]));
  });
}

    <h2 class="modal-title">${signal.article_title || signal.sector}</h2>

    <div class="modal-lead">${signal.description}</div>
    <div class="modal-body">${bodyHtml}</div>
    ${signal.article_url ? `<a class="modal-source-link" href="${signal.article_url}" target="_blank" rel="noopener">查看原文 →</a>` : ""}
  `;
  document.getElementById("modal-overlay").classList.add("open");
}

function buildChips(container, entries, colorMap, activeSet, onChange) {
  entries.forEach(([key, label]) => {
    const chip = document.createElement("div");
    chip.className = "chip active";
    chip.style.color = colorMap[key] || "var(--text-secondary)";
    chip.innerHTML = `<span class="dot" style="background:${colorMap[key] || "var(--text-muted)"}"></span>${label}`;
    chip.addEventListener("click", () => {
      if (activeSet.has(key)) { activeSet.delete(key); chip.classList.remove("active"); }
      else { activeSet.add(key); chip.classList.add("active"); }
      onChange();
    });
    container.appendChild(chip);
  });
}

  if (!searchTerm) { suggestionsBox.style.display = "none"; return; }
  const matches = nodes
    .filter(n => n.name.toLowerCase().includes(searchTerm) && (!currentSector || n.sectorTags.includes(currentSector)))
    .slice(0, 8);
  if (!matches.length) { suggestionsBox.style.display = "none"; return; }
  suggestionsBox.innerHTML = matches.map((n, i) => `
    <div class="suggestion-item" data-idx="${i}">
      <span class="dot" style="background:${NODE_TYPE_COLOR[n.type] || "var(--text-muted)"}"></span>
      ${n.name}
      <span class="type-label">${NODE_TYPE_LABEL[n.type] || n.type}</span>
    </div>
  `).join("");
  suggestionsBox.style.display = "block";
  suggestionsBox.querySelectorAll(".suggestion-item").forEach(el => {
    el.addEventListener("click", () => {
      const n = matches[parseInt(el.dataset.idx, 10)];
      searchInput.value = n.name;
      searchTerm = "";
      egoFocusId = n.id;
      suggestionsBox.style.display = "none";
      applyFilters();
      showNodeDetail(n);
      focusOnNode(n);
    });
  });
}

function focusOnNode(n) {
  viewX = -n.x * viewScale;
  viewY = -n.y * viewScale;
  applyTransform();
}

searchInput.addEventListener("input", (e) => {
  egoFocusId = null;
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
  renderSuggestions();
});
searchInput.addEventListener("focus", renderSuggestions);
document.addEventListener("click", (e) => {
  if (e.target !== searchInput && !suggestionsBox.contains(e.target)) {
    suggestionsBox.style.display = "none";
  }
});

// ---------- svg setup ----------
const svg = document.getElementById("svg");
const svgNS = "http://www.w3.org/2000/svg";
const viewport = document.createElementNS(svgNS, "g");
svg.appendChild(viewport);

const linkEls = links.map(l => {
  const el = document.createElementNS(svgNS, "line");
  el.setAttribute("class", "edge");
  el.setAttribute("stroke", EDGE_TYPE_COLOR[l.type] || "var(--text-muted)");
  el.setAttribute("stroke-width", "1.6");
  el.addEventListener("click", (ev) => { ev.stopPropagation(); showEdgeDetail(l); });
  el.addEventListener("mouseenter", (ev) => showTooltip(ev, `${nodeById[l.source].name} → ${nodeById[l.target].name}<br><span style="color:var(--text-muted)">${EDGE_TYPE_LABEL[l.type] || l.type}</span>`));
  el.addEventListener("mouseleave", hideTooltip);
  el.addEventListener("mousemove", moveTooltip);
  viewport.appendChild(el);
  return el;
});

function radiusFor(n) { return 6 + Math.min(14, Math.sqrt(n.mentions) * 4); }

const nodeGroups = nodes.map(n => {
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("class", "node");
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("r", radiusFor(n));
  circle.setAttribute("fill", NODE_TYPE_COLOR[n.type] || "var(--text-muted)");
  const text = document.createElementNS(svgNS, "text");
  text.textContent = n.name;
  text.setAttribute("x", radiusFor(n) + 4);
  text.setAttribute("y", 4);
  g.appendChild(circle);
  g.appendChild(text);
  g.addEventListener("click", (ev) => { ev.stopPropagation(); showNodeDetail(n); });
  g.addEventListener("mouseenter", (ev) => showTooltip(ev, `<b>${n.name}</b>${n.ticker ? ` <span style="color:var(--text-muted)">(${n.ticker})</span>` : ""}${n.hot ? `<span class="badge ${n.hot}">${n.hot === "hot" ? "热门" : "冷门"}</span>` : ""}<br><span style="color:var(--text-muted)">${NODE_TYPE_LABEL[n.type] || n.type} · 提及 ${n.mentions} 次</span>`));
  g.addEventListener("mouseleave", hideTooltip);
  g.addEventListener("mousemove", moveTooltip);
  makeDraggable(g, n);
  viewport.appendChild(g);
  return g;
});

svg.addEventListener("click", () => {
  document.getElementById("detail").innerHTML = '<div class="placeholder">点击一个节点或连线查看详情</div>';
  highlightNone();
  if (egoFocusId) {
    egoFocusId = null;
    searchInput.value = "";
    applyFilters();
  }
});

// ---------- force simulation (self-contained, no external deps) ----------
const idToIndex = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
function step() {
  const REPULSION = 2200, SPRING = 0.02, SPRING_LEN = 90, CENTER = 0.006, DAMPING = 0.85;
  for (let i = 0; i < nodes.length; i++) {
    let fx = 0, fy = 0;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const distSq = Math.max(dx * dx + dy * dy, 30);
      const force = REPULSION / distSq;
      fx += (dx / Math.sqrt(distSq)) * force;
      fy += (dy / Math.sqrt(distSq)) * force;
    }
    fx += -nodes[i].x * CENTER;
    fy += -nodes[i].y * CENTER;
    nodes[i].fx = fx; nodes[i].fy = fy;
  }
  for (const l of links) {
    const a = nodeById[l.source], b = nodeById[l.target];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (dist - SPRING_LEN) * SPRING;
    const fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.fx += fx; a.fy += fy;
    b.fx -= fx; b.fy -= fy;
  }
  for (const n of nodes) {
    if (n.dragging) continue;
    n.vx = (n.vx + n.fx) * DAMPING;
    n.vy = (n.vy + n.fy) * DAMPING;
    n.x += n.vx;
    n.y += n.vy;
  }
  render();
}

function render() {
  links.forEach((l, i) => {
    const a = nodeById[l.source], b = nodeById[l.target];
    const el = linkEls[i];
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  });
  nodes.forEach((n, i) => {
    nodeGroups[i].setAttribute("transform", `translate(${n.x},${n.y})`);
  });
}

let tickCount = 0;
const simInterval = setInterval(() => {
  step();
  tickCount++;
  if (tickCount > 260) clearInterval(simInterval);
}, 16);

// ---------- pan / zoom ----------
let viewX = 0, viewY = 0, viewScale = 1;
function applyTransform() {
  const w = svg.clientWidth, h = svg.clientHeight;
  viewport.setAttribute("transform",
    `translate(${w / 2 + viewX},${h / 2 + viewY}) scale(${viewScale})`);
}
applyTransform();
window.addEventListener("resize", applyTransform);

let panning = false, panStart = null;
svg.addEventListener("mousedown", (e) => {
  if (e.target === svg) { panning = true; panStart = { x: e.clientX - viewX, y: e.clientY - viewY }; }
});
window.addEventListener("mousemove", (e) => {
  if (panning) { viewX = e.clientX - panStart.x; viewY = e.clientY - panStart.y; applyTransform(); }
});
window.addEventListener("mouseup", () => { panning = false; });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  viewScale = Math.min(3, Math.max(0.2, viewScale * (e.deltaY > 0 ? 0.9 : 1.1)));
  applyTransform();
}, { passive: false });

function makeDraggable(g, n) {
  g.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    n.dragging = true;
    const move = (ev) => {
      const rect = svg.getBoundingClientRect();
      n.x = (ev.clientX - rect.left - rect.width / 2 - viewX) / viewScale;
      n.y = (ev.clientY - rect.top - rect.height / 2 - viewY) / viewScale;
      render();
    };
    const up = () => {
      n.dragging = false;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

// ---------- tooltip ----------
const tooltip = document.getElementById("tooltip");
function showTooltip(e, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(e);
}
function moveTooltip(e) {
  const wrap = document.getElementById("canvas-wrap").getBoundingClientRect();
  tooltip.style.left = (e.clientX - wrap.left + 14) + "px";
  tooltip.style.top = (e.clientY - wrap.top + 14) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

// ---------- detail panel ----------
function showNodeDetail(n) {
  highlightNode(n.id);
  const relatedEdges = links.filter(l => l.source === n.id || l.target === n.id);
  const evidenceHtml = relatedEdges.map(l => {
    const other = nodeById[l.source === n.id ? l.target : l.source];
    const dirLabel = EDGE_TYPE_LABEL[l.type] || l.type;
    return `<div class="evidence-item">
      <div><b>${dirLabel}</b> — ${other.name}</div>
      ${l.evidence.slice(-3).map(ev => `
        <div class="desc">${ev.description || ""}</div>
        <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""}</div>
      `).join("")}
    </div>`;
  }).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${n.name}${n.ticker ? ` <span style="color:var(--text-muted); font-weight:normal;">(${n.ticker})</span>` : ""}${n.hot ? `<span class="badge ${n.hot}">${n.hot === "hot" ? "热门" : "冷门"}</span>` : ""}</h2>
    <div class="meta">${NODE_TYPE_LABEL[n.type] || n.type}${n.sectorTags.length ? " · " + n.sectorTags.join(", ") : (n.sectors.length ? " · " + n.sectors.join(", ") : "")} · 提及 ${n.mentions} 次</div>
    ${evidenceHtml || '<div class="placeholder">暂无关系记录</div>'}
  `;
}

function showEdgeDetail(l) {
  const a = nodeById[l.source], b = nodeById[l.target];
  highlightNode(null, l);
  const evidenceHtml = l.evidence.map(ev => `
    <div class="evidence-item">
      <div class="desc">${ev.description || ""}</div>
      <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""} · ${ev.published || ""}</div>
    </div>
  `).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${a.name} ↔ ${b.name}</h2>
    <div class="meta">${EDGE_TYPE_LABEL[l.type] || l.type}</div>
    ${evidenceHtml}
  `;
}

function highlightNode(nodeId, edge) {
  let neighborIds = new Set();
  if (nodeId) {
    neighborIds.add(nodeId);
    links.forEach(l => {
      if (l.source === nodeId) neighborIds.add(l.target);
      if (l.target === nodeId) neighborIds.add(l.source);
    });
  } else if (edge) {
    neighborIds.add(edge.source);
    neighborIds.add(edge.target);
  }
  nodeGroups.forEach((g, i) => {
    g.classList.toggle("dim", neighborIds.size > 0 && !neighborIds.has(nodes[i].id));
  });
  linkEls.forEach((el, i) => {
    const l = links[i];
    const relevant = edge ? l === edge : (l.source === nodeId || l.target === nodeId);
    el.classList.toggle("dim", neighborIds.size > 0 && !relevant);
  });
}
function highlightNone() {
  nodeGroups.forEach(g => g.classList.remove("dim"));
  linkEls.forEach(el => el.classList.remove("dim"));
}

// ---------- filters ----------
function applyFilters() {
  nodes.forEach((n, i) => {
    const typeOk = activeNodeTypes.has(n.type);
    const sectorOk = !currentSector || n.sectorTags.includes(currentSector);
    let visible;
    if (egoFocusId) {
      visible = (n.id === egoFocusId || isDirectNeighbor(n.id, egoFocusId)) && typeOk && sectorOk;
    } else {
      const searchOk = !searchTerm || n.name.toLowerCase().includes(searchTerm);
      visible = typeOk && searchOk && sectorOk;
    }
    nodeGroups[i].style.display = visible ? "" : "none";
  });
  links.forEach((l, i) => {
    const typeOk = activeEdgeTypes.has(l.type);
    const endsVisible = nodeGroups[idToIndex[l.source]].style.display !== "none" &&
                         nodeGroups[idToIndex[l.target]].style.display !== "none";
    linkEls[i].style.display = (typeOk && endsVisible) ? "" : "none";
  });
}
</script>
