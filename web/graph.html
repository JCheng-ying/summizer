自主抓取和处置,这也是为什么 Katalyst 的 Link 任务(尽管刚经历过姿态控制问题)反而是三家里技术验证最直接的一家,风险和含金量都更高。**太空经济板块**里,受益的层次可以分开看:第一层是直接拿到合同的三家公司本身(Firefly Aerospace 是已经上市、有多元收入来源的公司,风险相对分散;D-Orbit USA 和 Katalyst 是初创公司,执行风险更集中但潜在弹性也更大);第二层是这条价值链上下游此前已经在做同类业务、目前还没进入这批合同的公司,比如 Starfish Space(已经有 SDA 的实单在手,是这个赛道里目前进度最靠前的参照系)。现在这几个方案都还停留在初步设计阶段,离真正的在轨演示还有距离,后续值得跟踪的具体信号是 SDA/DIU 什么时候公布进入完整演示阶段的公司名单,以及 Katalyst 的 Link 任务能不能真正完成对 Swift 天文台的抓取和抬升——这会是\"非合作目标捕获\"这项技术能力第一次拿到真实的在轨验证数据。", "published_ts": "2026-08-16T10:50:00+00:00"}, {"sector": "太空经济板块", "description": "月球着陆器产能从单件定制转向标准化量产,叠加即将授出的LRO继任轨道成像任务,利好Firefly Aerospace和Intuitive Machines等CLPS承包商及其着陆器供应链", "article_title": "Lunar orbiter among upcoming NASA CLPS task orders", "article_url": "https://spacenews.com/lunar-orbiter-among-upcoming-nasa-clps-task-orders/", "source_name": "SpaceNews", "published": "Sat, 15 Aug 2026 23:49:58 +0000", "added_at": "2026-08-16T20:13:18.281932+00:00", "article_body": "这篇文章表面上是一则财报会电话的信息汇总,但背后其实是月球商业服务这条产业链正在从\"单次任务竞标\"转向\"标准化量产\"的一个关键信号,而且顺带透露了 NASA 一项长期悬而未决的基础设施缺口即将补上。\n\n文章指出,Firefly Aerospace 和 Intuitive Machines——目前仅有的两家通过 NASA 商业月球有效载荷服务(CLPS)计划成功登月的公司——在本周各自的财报电话会上都提到,预计 NASA 今年内还会通过 CLPS 计划授出三个任务订单。其中两个是着陆器任务(CLPS 项目自 2019 年首次授标以来,几乎所有任务都是着陆器);但第三个不一样,是一个\"轨道成像服务\",Firefly CEO Jason Kim 和 Intuitive Machines CEO Steve Altemus 都提到,这个任务的目标是\"替代月球勘测轨道飞行器(LRO)\"。LRO 是 NASA 二十年前在\"重返月球\"愿景下开发的探测器,2009 年发射,搭载高分辨率相机等仪器持续开展月球科研,目前在延长任务期内运行至 2028 年——文章引用 2022 年月球探测分析组的一份报告指出,业内多年来一直在呼吁尽快启动 LRO 继任者的研制,认为这件事\"早就该做了\",但 NASA 至今未公开通过 CLPS 或其他渠道开发继任轨道器的计划,这次是两家公司在财报会上首次间接确认这个任务订单确实要来了。\n\n文章还指出,两家公司都已经在为这个轨道成像任务提前布局:Firefly 2025 年就宣布了名为 Ocula 的商业月球成像服务计划,用装在 Elytra 航天器上的相机、搭配未来的 Blue Ghost 着陆任务一起飞;Intuitive Machines 则已经拿到 NASA 的合同,负责运营 LRO 上的高分辨率相机,以及韩国 Danuri 月球轨道器上另一台 NASA 相机 ShadowCam——也就是说,这两家公司其实都已经在\"运营月球轨道相机\"这件事上有实操经验,谁能拿下这个新订单,某种程度上是过去几年各自布局的延续,而不是从零开始的竞标。\n\n文章更值得注意的一条线索,是两家公司都在谈\"标准化量产\"这个转变。今年 6 月双方都拿到了 CS-8 任务订单里的着陆器合同(Firefly 和 Intuitive Machines 各四个,另一家公司 Astrobotic/现更名 Voyager Lunar Systems 也拿到两个),这批着陆器会搭载完全相同的一套仪器组合。Kim 说这个任务的核心目标是\"证明能在加速的时间线上重复实现登月能力,执行时间是第一次登月任务的一半\",Altemus 也表达了类似意思——\"不再为每个任务单独定制着陆器,而是要把产能提上去\"。两家公司都在扩产:Intuitive Machines 在休斯顿总部新增了 7.5 万平方英尺产能,用于同时生产着陆器和五颗月球数据中继卫星;Firefly 的洁净室空间扩大到原来四倍以上。文章还提到,原 CLPS 合同下最后一个任务订单(CP-32)预计明年初授出,之后 NASA 会切换到新一轮合同 CLPS 2.0,最高金额 100 亿美元、为期十年,还有一个五年、再增加 50 亿美元的延期选项——两家公司都表示会参与投标,而且都在为 CLPS 2.0 准备更大型号的着陆器:Intuitive Machines 已经在用更大运力(约 500 公斤)的 Nova-D 着陆器执行 IM-6 任务,并考虑三发动机构型把运力提升到 1 吨,进一步瞄准 NASA 未来月球基地需要的 2 到 5 吨级运力;Firefly 也在开发一款\"模块化\"放大版 Blue Ghost,细节暂时保密。\n\n个人看法:这篇文章值得和[Wallops 发射场扩产](2026-08-14-wallops-gears-up-for-an-increase-in-launches.md)那篇一起看——太空经济板块里正在同时发生两件相互印证的事:发射端产能在扩张,月球服务端的着陆器产能也在从\"单件定制\"转向\"标准化量产\",两条线索指向的是同一个判断,就是行业整体在为\"未来几年任务数量会明显上一个台阶\"这件事提前铺产能,而不是被动等订单。用\"先找瓶颈\"的方法看,这里真正的瓶颈已经从\"能不能登月\"(两家公司都已验证过)转移到了\"能不能按可预测的节奏、可控的成本重复登月\"——这也是为什么两家公司都在谈论产能和标准化,而不是单纯谈论技术突破。太空经济板块里,受益的层次可以这样拆:第一层是拿到 CS-8/CLPS 2.0 订单的 Firefly Aerospace 和 Intuitive Machines 本身,尤其是 Intuitive Machines,因为它同时承接着陆器和轨道相机运营两条业务线,如果拿下 LRO 继任订单,相当于把现有的相机运营经验直接变现;第二层是为大型着陆器提供发动机、结构件的供应链公司,因为从百公斤级迈向吨级着陆器意味着推进系统需要实质性升级,这条供应链目前公开信息还不多,值得后续留意两家公司披露的具体供应商;第三层是长期受益于\"月球基地\"叙事的深空通信和月面基础设施类公司。现在 CLPS 2.0 的最终中标结果和轨道成像任务订单的具体归属都还没公布,后续值得跟踪的具体信号是这个\"LRO 继任者\"任务订单最终花落谁家,以及 CP-32 这最后一单会不会在明年初如期落地。", "published_ts": "2026-08-15T23:49:58+00:00"}, {"sector": "太空经济板块", "description": "Firefly Alpha Block II热防护升级回应此前发射失利,Eclipse中型火箭发动机认证测试推进,叠加洛克希德·马丁长期发射合同延期,利好Firefly及其发动机/热防护供应链", "article_title": "Firefly promote next block of Alpha amid Eclipse progress", "article_url": "https://www.nasaspaceflight.com/2026/08/firefly-block-alpha-eclipse-progress/", "source_name": "NASASpaceFlight.com", "published": "Sun, 16 Aug 2026 16:31:26 +0000", "added_at": "2026-08-16T20:14:03.945684+00:00", "article_body": "这篇文章讲的是 Firefly Aerospace 同时在两条火箭产品线上推进——一款已经量产但需要打补丁的小型运载火箭 Alpha,和一款尚未首飞的中型运载火箭 Eclipse——而这两条线索合在一起,反映的其实是一家发射公司典型的\"边修边扩\"路径:先把现有产品的可靠性问题解决掉,同时不停下对更大市场的布局。\n\n文章指出,Eclipse 是 Firefly 即将推出的中型运载火箭,设计运力超过 16 吨(近地轨道),相比现役的 Alpha 是一次显著的运力跃升。第一级正在按可重复使用设计,重点是\"原地回收\"——助推器完成分离后能飞回原发射场着陆。公司确认首飞仍计划在明年,但也表示早期飞行可能优先保证入轨成功,真正的助推器回收验证可能要推迟到系统在飞行中证明自己之后的任务。第一级由七台代号 Miranda 的煤油发动机提供动力,文章提到一个具体的测试里程碑:一台 Miranda 发动机完成了满功率、持续 226 秒(接近四分钟)的点火测试,远超正常上升段所需时长,测试过程中还对功率等级和 RP-1 煤油/液氧混合比做了扫描测试,用来摸清发动机在不同工况下的表现边界。Miranda 目前已经完成超过 150 次热点火测试,公司认为发动机性能已经达标,下一步会进入正式的认证测试阶段——这是发动机能被批准用于 Eclipse 首飞前必须跨过的关键节点。\n\n与此同时,现役的 Alpha 火箭也在做一次实质性的产品升级。文章指出,即将推出的 Block II 版本外观会从原来标志性的黑色碳纤维外壳变成白色,这个改动不只是视觉上的——白色涂层是升级版热防护系统的一部分,用于更好地管理上升段和大气飞行中的热载荷。文章把这个改动和 Alpha 第六次任务(\"Message In A Booster\")的失利直接联系起来:那次任务失败的原因是第一级一侧的温度显著高于预期,热防护余量不足最终导致级间分离时发生爆炸,所以这次热防护升级可以理解为对那次事故的直接工程回应。除了热防护,Block II 还拉长了推进剂贮箱,箭体整体增高超过两米,带来的额外推进剂容量预计能提升运力,让 Alpha 可以携带更重的载荷或抵达要求更高的轨道。这些升级会在今年第四季度的下一次 Alpha 任务(Block II 首飞)上首次亮相,同一季度还计划再打一次 Alpha 任务,用来快速验证改进版本的实际表现。文章最后提到一个具体的商业信号:洛克希德·马丁把和 Firefly 的 Alpha 发射合同延长了两年,总计最多可达 25 次发射、延续到 2031 年——原合同是 2024 年签的,承诺 15 次任务加 10 次可选,这次延长为双方都提供了更长期的规划确定性,也说明洛马对小卫星专用发射的需求是持续的。\n\n个人看法:这篇文章值得和之前写过的[Blue Origin 第二发射台](2026-08-14-blue-origin-outlines-plans-for-second-cape-canaveral-launch-pad.md)那篇一起看——两家公司都在\"现有产品还没完全稳定\"的阶段,同步推进下一代更大运力型号的研发,这似乎正在成为这一轮商业航天公司的共同打法:不等现有产品线完全成熟盈利,就把资源分流去布局更大市场。用\"先找瓶颈\"的方法看这篇文章,Alpha 的瓶颈曾经是可靠性(第六次任务的爆炸暴露了热防护设计缺陷),Block II 的白色涂层和拉长贮箱是对这个具体瓶颈的直接工程回应,而不是泛泛的\"升级\";Eclipse 的瓶颈则是发动机的耐久性和一致性验证,150 多次热点火测试加上这次接近四分钟的满功率长程测试,说明公司在往\"认证\"这个门槛上聚拢资源。**太空经济板块**里,受益的层次可以拆成两层:第一层是 Firefly Aerospace 本身,洛克希德·马丁的长期发射合同延长是一个可验证的收入确定性信号,值得在后续财报里持续跟踪 Alpha 的发射节奏是否真的能提上去;第二层是发动机相关的供应链和测试基础设施,Miranda 发动机的认证进度直接决定 Eclipse 首飞时间表,这也是整个中型运力赛道竞争(对比 Rocket Lab Neutron、Blue Origin New Glenn 等)里最容易被忽视但最关键的瓶颈层。现在 Eclipse 还没首飞,Block II Alpha 也还没验证过实际飞行表现,后续值得跟踪的具体信号是第四季度这两次 Alpha 任务(尤其是 Block II 首飞)能否顺利完成,这会是热防护升级和贮箱拉长这两项改动第一次接受真实飞行环境的检验。", "published_ts": "2026-08-16T16:31:26+00:00"}, {"sector": "太空经济板块", "description": "Blue Origin第二发射台VIF钢结构建设已实质推进,垂直吊装总装模式借鉴SpaceX Starbase设计,利好发射场地面设备/导流槽/大型吊装设备供应商", "article_title": "Blue Origin overviews plan for dual pad ops at Cape Canaveral", "article_url": "https://www.nasaspaceflight.com/2026/08/blue-origin-launch-pad-cape-canaveral/", "source_name": "NASASpaceFlight.com", "published": "Sat, 15 Aug 2026 22:57:11 +0000", "added_at": "2026-08-16T20:14:54.906452+00:00", "article_body": "这篇文章是对[之前写过的 Blue Origin 第二发射台](2026-08-14-blue-origin-outlines-plans-for-second-cape-canaveral-launch-pad.md)那条新闻的一次技术细节补完——上一篇讲的是\"公司宣布要建 LC-36B\",这一篇给出的是具体长什么样、怎么运作,信息密度明显更高,也更能看出这套双发射台方案背后真正的工程意图。\n\n文章指出,新发射台 LC-36B 会建在卡纳维拉尔角现有 36 号发射场以北,专门服务于运力更大的 New Glenn 9×4 型号,和服务于现役 New Glenn 7×2 型号的原发射台(现称 LC-36A)共用整个场区,配套建设一座全新的垂直总装设施(Vertical Integration Facility,VIF)。两个发射台会是完全独立、并行运作的两条产线——文章强调这套双发射台方案的意图很明确:一边给 Blue Origin 一条修复后重新恢复飞行的路径(LC-36A),一边为运力更大的 9×4 型号铺好通往更高发射频率的路。7×2 型号已经飞过三次、今年早些时候在发射台上发生过一次爆炸,第一级用七台 BE-4 发动机、第二级两台 BE-3U 发动机;9×4 型号会把第一级发动机数量提升到九台 BE-4、第二级四台 BE-3U,从而获得更大的入轨运力。\n\n文章披露的技术细节比之前那篇更具体:第一,操作模式上,Blue Origin 计划用移动式起重机而非传统的水平总装/运输/竖起(transporter-erector)方式来完成竖直堆叠,团队已经在原 11 号发射场用二级模拟件和整流罩模拟件practice 这套流程,为后续应用到真实飞行硬件做准备——这和上一篇文章提到的\"第一级水平运输、第二级和载荷垂直吊装\"的混合总装模式是同一套思路的具体执行细节。第二,LC-36B 的渲染图显示了抬升式发射台、大型导流槽和一座配备双吊装臂的塔架,文章直接点出整体布局和 SpaceX 在 Starbase 的 Starship 二号发射台高度相似——这个设计思路后来又被 SpaceX 应用到了得州和佛罗里达的其他 Starship 发射台上,但 Blue Origin 的塔架配置和 LC-36A 重建后的结构不同,更像是为快速垂直总装单独优化的方案;文章特别指出,这套吊装臂不是为了捕获回收一级火箭设计的——9×4 的一级仍会保留着陆支腿,塔架朝向也不支持捕获式回收操作,这澄清了一个容易被渲染图误导的猜测。第三,配套设施上,公司正在跑道以北建设 VIF(钢结构搭建已经在推进),并计划在更靠南的位置建一座独立的载荷处理设施(Payload Processing Facility),让整流罩和载荷总装能更靠近发射台完成,进一步支撑更高的发射频率。文章也坦承,9×4 型号完整的作业流程细节还没公开——载荷具体如何从处理设施经过 VIF、再通过塔架吊装臂运抵发射台,目前还缺乏完整描述。\n\n个人看法:把这篇和上一篇 SpaceNews 的报道放在一起读,能看出一个从\"宣布计划\"到\"公开工程细节\"的推进节奏——上一篇文章的判断(Blue Origin 在尚未完全恢复现有产能的情况下依然选择激进扩产)在这一篇里得到了更具体的印证:VIF 的钢结构已经在建,载荷处理设施也已经列入规划,说明这不是纸面规划,而是真金白银在推进的工程项目。值得单独指出的一点是,LC-36B 的整体设计思路直接借鉴了 SpaceX Starbase 二号发射台的经验(抬升式发射台+大型导流槽+垂直吊装塔),这说明\"快速垂直总装+原地竖立\"正在成为下一代重型/中型运载火箭发射场设计的事实标准,而不只是某一家公司的偏好——这对**太空经济板块**里做发射场地面设备、导流槽/耐火材料、大型吊装设备的供应商是一个值得跟踪的间接利好信号,因为无论最终是 Blue Origin 还是 SpaceX 或其他公司胜出运力竞赛,这类地面基础设施的建设需求都是确定性增长的。风险点依然和上一篇文章一致:LC-36B 的具体建设时间表和 New Glenn 9×4 的首飞时间表都还没公布,LC-36A 本身能否如期在年内恢复试飞也还是未知数——后续值得跟踪的具体信号是 VIF 钢结构什么时候完工、以及垂直吊装对接这套新总装模式在 LC-11 的模拟件演练能不能顺利过渡到真实飞行硬件上。", "published_ts": "2026-08-15T22:57:11+00:00"}, {"sector": "机器人板块", "description": "传统制造业公司(Unichem)并购电子皮肤初创公司Loomia,叠加R&Y联合研发触觉传感器并瞄准Tesla/Boston Dynamics等头部客户,标志人形机器人触觉传感这一硬件品类从初创研发走向传统制造业整合量产阶段", "article_title": "Unichem acquires Loomia to accelerate entry into the humanoid ‘skin’ market", "article_url": "https://www.therobotreport.com/unichem-acquires-loomia-accelerate-entry-humanoid-skin-market/", "source_name": "The Robot Report - Haptics", "published": "Tue, 18 Aug 2026 12:49:41 +0000", "added_at": "2026-08-19T04:37:00.557364+00:00", "article_body": "这篇文章讲的是一笔具体的并购交易,但它揭示的其实是人形机器人产业链里一个正在从\"实验室原型\"走向\"传统制造业收购整合\"的细分环节——电子皮肤/触觉传感,而这条路径和芯片、电池这些更早成熟的机器人零部件走过的产业化路径其实是同一个模式。\n\n文章指出,韩国材料公司 Uni-Chem(Unichem)本月收购了柔性电子公司 Loomia Technologies,借此进入人形机器人\"电子皮肤\"市场,同时也切入智能座舱内饰材料市场。Loomia 由斯坦福大学毕业生 Madison Maxey 2014 年创立,总部在布鲁克林,核心技术是 LEL(Loomia Electronic Layer),能把电路柔性粘合到布料和皮革上,文章指出这项技术\"解决了传统印刷电子在弯折时容易断路的问题\",用的是非印刷、低电阻网状结构。Loomia 是美国国家科学基金会\"人类增强灵巧工程研究中心\"(HAND ERC)的成员,这个触觉传感联盟里还包括 Meta 和 Amazon Robotics——这说明 Loomia 的技术路线早就进入了大厂的关注视野,这次收购某种程度上是把一个已经被行业验证过方向的小公司,并入了一条更完整的产业化能力里。\n\n交易结构上,Unichem 以约 86 亿韩元(约 600 万美元)拿下 Loomia 100% 股份,支付方式是现金 400 万美元加股票 100 万美元再加 100 万美元的对赌条款(earn-out),预计通过反向三角合并、10 月 15 日完成交割。Unichem 本身是一家 1976 年成立、深耕汽车内饰真皮和时尚产业近 50 年的韩国安山公司,文章指出这次收购是它从\"内饰材料制造商\"转型为\"智能材料平台公司\"的起点,计划把 Loomia 的超薄柔性 LEL 技术延伸到人形机器人的手部和电子皮肤、医疗设备、以及数据中心热管理这几个方向——这个延伸方向本身也值得注意,因为它说明这类柔性电子材料公司看到的不只是机器人这一个应用场景,而是把自己定位成一个跨行业的材料平台。\n\n文章更关键的一条线索,是 Loomia 和另一家公司 R&Y 的联合研发合作。R&Y 是 2022 年成立、市值超过 10 亿美元、员工超过 2000 人的全球一级汽车技术制造商,在德国、密歇根、常州都有工厂,正在扩张进入人形机器人和电子皮肤领域。Loomia 和 R&Y 正在联合开发一款能同时检测垂直压力和剪切力(表面滑动力)的传感器——文章指出这项技术对采集机器人训练数据用的触觉手套、以及需要像人一样精确抓取物体的人形机器人都是必需的。R&Y 计划 2027 年 1 月交付首个工程样品,目标客户直接点名了 Tesla、OpenAI、Boston Dynamics、1X Technologies、Meta 这几家全球顶级机器人/AI 公司。文章还提到一个具体的商业验证:大众汽车已经通过座椅零部件公司 Sabelt,选定 Loomia 作为下一代座椅加热系统的供应商,用在旗下某款车型上——这说明 Loomia 的柔性电子技术已经拿到过汽车行业量产订单的验证,不是纯实验室阶段的技术。\n\n个人看法:这篇文章值得和之前读过的[Muse Code](2026-08-14-muse-code-wants-your-data.md)、[Gemini Robotics 2](2026-08-14-googles-robotics-model-has-legs.md)这类聚焦\"大模型/软件层\"的机器人文章放一起看——那些文章讲的是感知和决策的智能层在快速迭代,而这篇文章提醒的是,人形机器人真正要落地,硬件层的触觉/皮肤这类此前一直被视为\"配角\"的部件,正在从零散的初创公司研发,走向被传统制造业巨头并购整合的阶段,这和电池、电机这些机器人硬件品类几年前走过的路径几乎一样。用\"先找瓶颈\"的方法看,这篇文章暗示的瓶颈不是\"能不能做出触觉传感器\"(Loomia 已经量产过座椅加热系统),而是\"能不能在人形机器人需要的精度和成本下大规模制造\"——这正是 Unichem 50 年皮革加工产能和 R&Y 汽车级量产能力要解决的问题,传感器技术本身反而不是稀缺资源。**机器人板块**里,受益的层次可以拆成:第一层是 Unichem 和 R&Y 这类拥有传统制造产能、正在向机器人零部件转型的供应链公司,它们的护城河其实是产能和良率,而不是专利技术本身;第二层是 R&Y 点名的下游客户 Tesla、Boston Dynamics、1X Technologies——如果电子皮肤这个部件能被稳定量产供货,意味着这些公司的人形机器人在\"精细操作\"这个能力维度上会有实质提升,值得关注它们后续是否公开采用类似的触觉传感方案。现在这笔交易要到 10 月才完成交割,R&Y 的工程样品也要等到 2027 年 1 月才交付,后续值得跟踪的具体信号是这款联合研发的压力/剪切力传感器能不能真正进入 Tesla 或 1X 这类公司的供应链,这会是电子皮肤这个细分品类第一次拿到头部人形机器人厂商的实单验证。", "published_ts": "2026-08-18T12:49:41+00:00"}, {"sector": "AI板块", "description": "DNA-钙钛矿混合忆阻器实验室成果显示存储密度更高、能耗降至十分之一,提示AI算力扩张的长期瓶颈可能从计算本身转移到存储介质与能耗,值得作为早期学术信号持续跟踪", "article_title": "Scientists turn DNA into a memory device that uses 100x less power", "article_url": "https://www.sciencedaily.com/releases/2026/08/260816044853.htm", "source_name": "ScienceDaily - Robotics", "published": "Mon, 17 Aug 2026 04:06:45 EDT", "added_at": "2026-08-19T04:37:09.677292+00:00", "article_body": "这篇文章讲的是一项还处在论文和专利申请阶段的材料科学研究,但它指向的问题是 AI 算力扩张里一个越来越绕不开的物理约束:如果计算需求持续指数增长,而能耗和存储密度跟不上,那么下一轮突破可能不来自更强的芯片架构,而来自更根本的存储介质本身。\n\n文章指出,宾夕法尼亚州立大学的研究团队把合成 DNA 和晶体钙钛矿(一种已经用于太阳能电池、激光器、存储器件的半导体材料)结合,做出了一种能同时存储和处理信息的忆阻器(memristor)。DNA 之所以被视为存储介质的候选者,是因为它的信息密度极高——文章提到 1 克 DNA 能存下约 2.15 亿 GB 数据,但过去的难点在于生物 DNA 和电子材料是两个完全不兼容的体系,天然 DNA 是像\"湿意大利面\"一样缠绕在一起的长链,难以在极小尺度上精确排布。研究团队的解法是用商业化的化学合成 DNA,按电子学需求定制成短而刚性的序列,再掺入银纳米颗粒(一种叫\"doping\"的工艺),让 DNA 既能导电,又能帮助分子单元排列得更有序。\n\n文章解释了忆阻器本身的意义:和普通电阻器断电就丢失信息不同,忆阻器能\"记住\"之前电流流动的方向,即使断电后依然保留这段记录,这种\"存储和处理发生在同一个物理位置\"的特性,和大脑神经元的工作方式类似,能支持更多并行、更复杂的数据处理形式——这正是神经形态计算(neuromorphic computing)想要实现的目标,研究者认为 AI 等新兴技术会越来越依赖这种更接近人脑运作方式的计算范式。文章给出的具体性能数据:这种银掺杂 DNA 和钙钛矿组成的复合结构,在低于 0.1 伏特(作为对比,美标插座电压是 120 伏)的驱动电压下,电子迁移就能稳定发生,电流方向切换时响应也符合预期;器件在接近 250 华氏度(约 121 摄氏度)的高温下能持续稳定工作,常温下功能保持超过六周,这个稳定性明显超过现有钙钛矿基存储器件的表现;最关键的一条是,这种器件消耗的能量只有同类技术的十分之一,存储容量却比传统闪存这类存储设备更高。研究者特别强调,单独使用 DNA 或单独使用钙钛矿都做不出这么好的效果,是两者结合本身催生了高存储密度和低能耗的组合优势。\n\n文章指出,这项研究发表在《Advanced Functional Materials》期刊,并已提交专利申请,团队下一步计划继续优化这项技术,探索更多生物启发电子系统的应用方向,由美国国家科学基金会、美国国立卫生研究院、宾大和明尼苏达大学共同资助。\n\n个人看法:这篇文章的价值不在于它离商业化有多近(论文阶段的材料科学研究,通常距离规模化生产还有很长的路要走,这一点必须先说清楚,不能因为\"100 倍低功耗\"这个数字就直接跳到投资结论),而在于它提示了一个方向性的判断:**AI 板块**长期的算力扩张,瓶颈会越来越从\"计算本身\"转移到\"存储和能耗\"这一层——这和之前多篇文章反复出现的判断(算力基础设施几乎总是确定性受益方)是同一条逻辑的延伸,只是这次指向的是存储介质而不是 GPU 本身。用\"先找瓶颈\"的方法看,今天数据中心的能耗大头除了计算芯片,散热和存储读写同样占了相当比例,如果生物-半导体混合存储器件这条路径真的能规模化,受益的会是那些同时具备半导体制造能力和材料工艺积累的公司,而不是某个单一的\"DNA 存储\"概念股——目前这类技术还处在实验室和大学团队手里,没有对应的上市公司可以直接挂钩,值得作为一个需要持续跟踪学术进展的早期信号,而不是一个可以现在就下注的投资标的。后续值得关注的具体节点是这项技术会不会有产业界公司(比如现有的钙钛矿器件厂商)拿到授权尝试中试生产,那会是这项技术从论文走向产业化的第一个可验证信号。", "published_ts": "2026-08-17T04:06:45+00:00"}, {"sector": "机器人板块", "description": "Persona避开通用人形机器人红海,选择造船焊接这一劳动力短缺、经济性明确的垂直场景切入,并已与HD Hyundai、POSCO建立合作,验证了限定场景商业化路径的可行性", "article_title": "Is Shipyard Welding the Right First Job for Humanoid Robots?", "article_url": "https://spectrum.ieee.org/persona-ai-humanoid-robot-welding", "source_name": "IEEE Spectrum - Robotics", "published": "Mon, 17 Aug 2026 15:33:42 +0000", "added_at": "2026-08-19T04:37:27.695718+00:00", "article_body": "这篇文章讲的是人形机器人公司 Persona 的商业化路径选择,但它真正有意思的地方,是提出了一个和大多数人形机器人公司叙事完全相反的策略:与其瞄准仓储、汽车产线、家庭这些每家公司都在抢的\"通用劳动力\"场景,不如找一个技能门槛高、劳动力稀缺、而且恰好适合机器人擅长的重复精度的细分场景切入——焊接,而且是难度最高的场景之一:造船厂。\n\n文章指出,Persona 由 Nic Radford 和 Jerry Pratt 创立,Radford 此前负责过 NASA 约翰逊航天中心的 Valkyrie 人形机器人项目,也是海洋机器人公司 Nauticus Robotics 的创始人;Pratt 此前带领佛罗里达人机认知研究所(IHMC)的团队参加过 DARPA 机器人挑战赛,后来在 Figure 担任过几年 CTO——两人都是行业里的资深人物,这一点本身就说明这不是一个从零摸索的新兵团队。文章提到,2024 年 IEEE Spectrum 第一次采访 Persona 时,公司还没确定具体聚焦哪个场景,\"仓储、汽车、甚至家庭我们都提过\"——这和几乎所有其他人形机器人公司现在的打法一模一样。真正的转折点是 Radford 提出的判断:非熟练劳动力这条路径经济性算不过账,与其和所有人挤在同一个红海赛道,不如瞄准更贵的熟练技能劳动力,他称之为\"后发优势\"——\"我们看过所有人在做什么,然后决定用一条不同的路\"。\n\n文章详细拆解了 Persona 选择焊接、尤其是造船厂焊接的具体原因,这部分是这篇文章里最有价值的产业分析。第一,焊接本身速度天然受限——金属熔化的速度决定了焊接不可能比每秒一厘米更快,这个\"慢\"恰好是机器人擅长的节奏;而高质量焊接需要毫米级精度的重复动作,人类会疲劳、会分心,机器人在长时间任务里反而更稳定,Pratt 认为在这类不算最复杂的直线焊缝上,机器人很快就能做到和人类持平甚至更好。第二,选择造船厂而不是更常见的产线场景,是因为造船厂环境本身更适合双足机器人——开放式船坞长达几百米,遍布需要跨越的水平和垂直桁材,工作面从地面到头顶到舱口都有,Persona 比较过四足甚至更多足的方案,最终判断两足机器人对现有造船厂作业节奏的干扰最小。第三,也是最关键的一点,造船厂这个场景让 Persona 的安全和定价逻辑都变得更宽松:双足机器人摔倒砸到人这类安全顾虑,在本来就配备专业防护训练工人的工业船坞环境里被大幅缓解;同时因为几乎没有其他公司在做这个细分场景,Persona 不需要靠压低价格竞争,可以把资源投入质量而不是被迫偷工减料。\n\n文章指出 Persona 目前公开的两个合作伙伴是全球最大造船公司 HD Hyundai,以及全球第三大钢铁生产商 POSCO,都在韩国。Radford 透露公司感兴趣的客户是那些能在单一地点部署\"几百台\"机器人的规模,而合作的商业逻辑也和大多数人形机器人公司的叙事不同——不是\"用机器人替代人降成本\",而是\"用机器人解决劳动力短缺、帮客户做大营收\":Radford 说\"我们现有的合作伙伴订单积压严重,而且受限于劳动力,所以我们想帮客户做大营收上限,而不一定是压低成本\"。这意味着即便机器人比人贵,只要能承接原本因为缺人而接不下的订单,对造船厂来说依然是净增量价值。文章也坦诚指出这条路径需要的时间成本——要收集数万小时的专家示范数据、搭建高保真仿真、做大量真实世界测试,而且 Persona 依然要证明自己\"经济可行的机器人公司\"这个假设本身能不能成立,这是每一家人形机器人公司都要跨过的同一道坎。\n\n个人看法:这篇文章值得和之前的[Loomia 电子皮肤收购](2026-08-18-unichem-acquires-loomia-to-accelerate-entry-into-the-humanoid-skin-market.md)那篇放在一起看——一边是硬件层的触觉传感正在被传统制造业整合产业化,一边是应用层出现了一个明确偏离\"通用人形机器人\"主流叙事、转而做垂直场景深度绑定的打法,两条线索合在一起,指向的是**机器人板块**里一个越来越清晰的分化:一部分公司在赌\"通用性\"最终会跑赢,另一部分公司在赌\"限定场景的经济可行性\"能更快落地变现。用\"先找瓶颈\"的方法看,Persona 这个案例里真正的瓶颈不是机器人的运动能力(这早就不缺demo了),而是\"能不能找到一个机器人相对人类有明确经济优势、且客户愿意为增量产能买单而不是纠结成本\"的具体场景——造船业焊接工人短缺、订单积压这个供需缺口,恰好提供了这样一个场景,这也是这篇文章标题问题(\"造船焊接是不是人形机器人合适的第一份工作\")背后真正想回答的问题。投资角度上,受益层次可以拆开看:第一层是 Persona 本身,作为一家还未公开融资细节的初创公司,值得关注它和 HD Hyundai、POSCO 这两家客户的合作能不能从\"几十台\"规模的试点走到 Radford 说的\"几百台\"规模部署,这会是判断经济模型是否真的成立的关键信号;第二层是同样面临熟练工人短缺、订单积压问题的其他重工业领域(造船之外的钢结构、大型设备焊接组装),如果 Persona 的模式在造船厂验证成功,这类相邻市场的复制会比通用场景更快;第三层则是 Radford 提到的\"研磨、喷漆等其他造船厂相邻工序\",这是 Persona 自己规划的扩展路径,值得作为公司后续动作的观察窗口。现在还早,Persona 还没有公开披露具体部署数量和财务数据,只能持续跟踪它和现有两家客户的合作进展。", "published_ts": "2026-08-17T15:33:42+00:00"}, {"sector": "AI板块", "description": "Faraday等AI科学家/科研自动化监督模型在论文复现任务上超过前沿模型表现,验证了小型监督层套在大模型外面就能提升科研自动化能力的思路,利好AI科研自动化工具方向", "article_title": "Import AI 469: Science AI; RSI simulator; and Zuck's technological pessimism", "article_url": "https://importai.substack.com/p/import-ai-469-science-ai-rsi-simulator", "source_name": "Import AI (Substack)", "published": "Mon, 17 Aug 2026 13:05:36 GMT", "added_at": "2026-08-19T04:37:34.488074+00:00", "article_body": "这期 Import AI 的几条新闻放在一起,讲的是 AI 系统\"自主发现\"和\"自主科研\"这条能力线正在从评测基准走向具体产品,而与此同时,行业里关于超级智能到底会把权力导向谁,还完全没有共识。\n\n先说评测这条线。新基准 DiG-bench(Discovery in Games)专门测试 AI 系统能不能通过探索和好奇心,自己摸索出一个环境隐藏的规则,而不是被直接喂规则——这是理解 AI 系统\"直觉\"和\"创造力\"能力的一个关键切入点。这套基准包含 70 个纯文本小游戏,每个游戏都是一个自成体系的微型世界,规则和目标都是隐藏的,必须通过互动才能发现,思路上和视觉版的 ARC 基准类似。文章指出参与研究的机构包括牛津大学、普林斯顿大学、麻省理工等,作者之一是 Juergen Schmidhuber,一位极具创造力的资深 AI 研究者。测试结果上,Opus 5 和搭配 Claude Code 的 Fable 5 是表现最好的模型,其次是 GPT-5.5;只有 Opus 5 和 Fable 5 能在最难的第七档拿到一点点分数(约 20% 的任务),而人类测试者在同一档能拿到 100%——文章指出这个巨大差距说明前沿模型虽然已经具备一些发现能力,但距离人类水平还有明显距离,作者的猜测是 2027 年年中左右会追上人类水平,届时递归自我改进(RSI)可能会真正开始加速。\n\n第二条线索更直接地指向\"自主科研\"这个方向。AI 创业公司 Inherent 发布了一个名为 Faraday 的\"AI 科学家\"模型,思路是用一个相对小的监督模型(27B,基于 Qwen-3.6-27B 训练,底层调用 OpenAI Codex 作为工具)去指挥、监督更大的前沿模型完成科研任务,本质上是\"可扩展监督\"问题的一个能力导向版本。文章指出团队构建了一个叫 Replica 的数据集,取 1990 到 2026 年间 100 篇机器学习和 AI-for-science 论文,故意抠掉其中的关键图表或结果,再看 AI 系统能不能自主做实验把空白填回去,并持续用 GRPO 算法训练 Faraday 这个监督模型。结果显示,搭配 Codex 的 Faraday 在 73% 的分布内机器学习任务和 60% 的分布外 AI-for-science 任务上,表现超过了直接用 Opus 4.8 或 GPT-5.5——这说明一个专门训练过\"怎么监督科研任务\"的小模型,套在更强的底层模型外面,能带来实质性的能力提升,而且这种监督能力可能会随着底层模型变强而持续复利。\n\n第三条是一篇观点性的评论,针对 Mark Zuckerberg 最近发表的长文《The Future is for Everyone》。Zuckerberg 的核心主张是把超级智能能力最大程度普及给每个人,以此避免权力集中在少数人手里,信条是\"个体赋能是繁荣的源泉,发明是超级智能的首要目的,权力平衡是安全的基础\"。文章的批评点很集中:Zuckerberg 的论述里反复出现\"每个人都将拥有发明超能力\"这类表述,但完全没有正面回答一个关键问题——一个具备超人发明能力的系统,凭什么会心甘情愿地只为比它能力弱得多的普通人服务,而不是从根本上改变世界的权力格局?文章认为这不是\"超级智能一定会变成某种独立于人类的恶意实体\"的悲观论调,而是指出\"发明能力普及\"和\"权力保持分散\"这两件事之间的因果关系,Zuckerberg 的文章基本没有论证,只是假设它们会同时发生。\n\n个人看法:这三条放在一起看,呈现的是能力和治理两条线在同步往前推进,但速度明显不对称。DiG-bench 和 Faraday 都指向同一个方向——AI 系统在\"自主发现未知规则\"和\"自主设计科研实验\"这两项能力上正在快速逼近实用门槛,而且 Faraday 的案例特别值得注意,因为它证明了一个思路:不一定需要更大的底层模型才能提升科研自动化能力,一个专门训练的\"监督层\"小模型套在外面就能带来明显提升,这对**AI 板块**里做 AI 科研自动化工具/AI Scientist 这类产品的公司是一个直接的能力验证信号,值得持续跟踪 Inherent 这类公司后续会不会有更多产品化动作。而 Zuckerberg 的文章代表的治理讨论,目前依然停留在愿景层面,没有看到具体可执行的机制,这条线短期不构成交易信号,但决定了大厂在超级智能能力真正逼近时, function formatDate(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toISOString().slice(0, 10);
}

function mdToHtml(md) {
  const escaped = (md || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return escaped
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(p => p && p !== "---")
    .map(p => p.startsWith("个人看法") ? `<p class="personal-view">${p}</p>` : `<p>${p}</p>`)
    .join("");
}

  return g;
});

svg.addEventListener("click", () => {
  document.getElementById("detail").innerHTML = '<div class="placeholder">点击一个节点或连线查看详情</div>';
  highlightNone();
  if (egoFocusId) {
    egoFocusId = null;
    searchInput.value = "";
    applyFilters();
  }
});

// ---------- force simulation (self-contained, no external deps) ----------
const idToIndex = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
function step() {
  const REPULSION = 2200, SPRING = 0.02, SPRING_LEN = 90, CENTER = 0.006, DAMPING = 0.85;
  for (let i = 0; i < nodes.length; i++) {
    let fx = 0, fy = 0;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const distSq = Math.max(dx * dx + dy * dy, 30);
      const force = REPULSION / distSq;
      fx += (dx / Math.sqrt(distSq)) * force;
      fy += (dy / Math.sqrt(distSq)) * force;
    }
    fx += -nodes[i].x * CENTER;
    fy += -nodes[i].y * CENTER;
    nodes[i].fx = fx; nodes[i].fy = fy;
  }
  for (const l of links) {
    const a = nodeById[l.source], b = nodeById[l.target];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (dist - SPRING_LEN) * SPRING;
    const fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.fx += fx; a.fy += fy;
    b.fx -= fx; b.fy -= fy;
  }
  for (const n of nodes) {
    if (n.dragging) continue;
    n.vx = (n.vx + n.fx) * DAMPING;
    n.vy = (n.vy + n.fy) * DAMPING;
    n.x += n.vx;
    n.y += n.vy;
  }
  render();
}

function render() {
  links.forEach((l, i) => {
    const a = nodeById[l.source], b = nodeById[l.target];
    const el = linkEls[i];
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  });
  nodes.forEach((n, i) => {
    nodeGroups[i].setAttribute("transform", `translate(${n.x},${n.y})`);
  });
}

let tickCount = 0;
const simInterval = setInterval(() => {
  step();
  tickCount++;
  if (tickCount > 260) clearInterval(simInterval);
}, 16);

// ---------- pan / zoom ----------
let viewX = 0, viewY = 0, viewScale = 1;
function applyTransform() {
  const w = svg.clientWidth, h = svg.clientHeight;
  viewport.setAttribute("transform",
    `translate(${w / 2 + viewX},${h / 2 + viewY}) scale(${viewScale})`);
}
applyTransform();
window.addEventListener("resize", applyTransform);

let panning = false, panStart = null;
svg.addEventListener("mousedown", (e) => {
  if (e.target === svg) { panning = true; panStart = { x: e.clientX - viewX, y: e.clientY - viewY }; }
});
window.addEventListener("mousemove", (e) => {
  if (panning) { viewX = e.clientX - panStart.x; viewY = e.clientY - panStart.y; applyTransform(); }
});
window.addEventListener("mouseup", () => { panning = false; });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  viewScale = Math.min(3, Math.max(0.2, viewScale * (e.deltaY > 0 ? 0.9 : 1.1)));
  applyTransform();
}, { passive: false });

function makeDraggable(g, n) {
  g.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    n.dragging = true;
    const move = (ev) => {
      const rect = svg.getBoundingClientRect();
      n.x = (ev.clientX - rect.left - rect.width / 2 - viewX) / viewScale;
      n.y = (ev.clientY - rect.top - rect.height / 2 - viewY) / viewScale;
      render();
    };
    const up = () => {
      n.dragging = false;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
}

// ---------- tooltip ----------
const tooltip = document.getElementById("tooltip");
function showTooltip(e, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(e);
}
function moveTooltip(e) {
  const wrap = document.getElementById("canvas-wrap").getBoundingClientRect();
  tooltip.style.left = (e.clientX - wrap.left + 14) + "px";
  tooltip.style.top = (e.clientY - wrap.top + 14) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

// ---------- detail panel ----------
function showNodeDetail(n) {
  highlightNode(n.id);
  const relatedEdges = links.filter(l => l.source === n.id || l.target === n.id);
  const evidenceHtml = relatedEdges.map(l => {
    const other = nodeById[l.source === n.id ? l.target : l.source];
    const dirLabel = EDGE_TYPE_LABEL[l.type] || l.type;
    return `<div class="evidence-item">
      <div><b>${dirLabel}</b> — ${other.name}</div>
      ${l.evidence.slice(-3).map(ev => `
        <div class="desc">${ev.description || ""}</div>
        <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""}</div>
      `).join("")}
    </div>`;
  }).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${n.name}${n.ticker ? ` <span style="color:var(--text-muted); font-weight:normal;">(${n.ticker})</span>` : ""}${n.hot ? `<span class="badge ${n.hot}">${n.hot === "hot" ? "热门" : "冷门"}</span>` : ""}</h2>
    <div class="meta">${NODE_TYPE_LABEL[n.type] || n.type}${n.sectorTags.length ? " · " + n.sectorTags.join(", ") : (n.sectors.length ? " · " + n.sectors.join(", ") : "")} · 提及 ${n.mentions} 次</div>
    ${evidenceHtml || '<div class="placeholder">暂无关系记录</div>'}
  `;
}

function showEdgeDetail(l) {
  const a = nodeById[l.source], b = nodeById[l.target];
  highlightNode(null, l);
  const evidenceHtml = l.evidence.map(ev => `
    <div class="evidence-item">
      <div class="desc">${ev.description || ""}</div>
      <div class="src"><a href="${ev.article_url}" target="_blank" rel="noopener">${ev.article_title}</a> · ${ev.source_name || ""} · ${ev.published || ""}</div>
    </div>
  `).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${a.name} ↔ ${b.name}</h2>
    <div class="meta">${EDGE_TYPE_LABEL[l.type] || l.type}</div>
    ${evidenceHtml}
  `;
}

function highlightNode(nodeId, edge) {
  let neighborIds = new Set();
  if (nodeId) {
    neighborIds.add(nodeId);
    links.forEach(l => {
      if (l.source === nodeId) neighborIds.add(l.target);
      if (l.target === nodeId) neighborIds.add(l.source);
    });
  } else if (edge) {
    neighborIds.add(edge.source);
    neighborIds.add(edge.target);
  }
  nodeGroups.forEach((g, i) => {
    g.classList.toggle("dim", neighborIds.size > 0 && !neighborIds.has(nodes[i].id));
  });
  linkEls.forEach((el, i) => {
    const l = links[i];
    const relevant = edge ? l === edge : (l.source === nodeId || l.target === nodeId);
    el.classList.toggle("dim", neighborIds.size > 0 && !relevant);
  });
}
function highlightNone() {
  nodeGroups.forEach(g => g.classList.remove("dim"));
  linkEls.forEach(el => el.classList.remove("dim"));
}

// ---------- filters ----------
function applyFilters() {
  nodes.forEach((n, i) => {
    const typeOk = activeNodeTypes.has(n.type);
    const sectorOk = !currentSector || n.sectorTags.includes(currentSector);
    let visible;
    if (egoFocusId) {
      visible = (n.id === egoFocusId || isDirectNeighbor(n.id, egoFocusId)) && typeOk && sectorOk;
    } else {
      const searchOk = !searchTerm || n.name.toLowerCase().includes(searchTerm);
      visible = typeOk && searchOk && sectorOk;
    }
    nodeGroups[i].style.display = visible ? "" : "none";
  });
  links.forEach((l, i) => {
    const typeOk = activeEdgeTypes.has(l.type);
    const endsVisible = nodeGroups[idToIndex[l.source]].style.display !== "none" &&
                         nodeGroups[idToIndex[l.target]].style.display !== "none";
    linkEls[i].style.display = (typeOk && endsVisible) ? "" : "none";
  });
}
